g> when a lead is Won or a quotation is accepted.</li><li>Each project records the lead it came from, its stakeholders, manager, value and linked quotation.</li><li>Emails composed with a project selected copy its primary stakeholders and stay attached to the project.</li></ul></section></aside></div>'; }
    else if (tab === 'activities') body = '<div class="cols"><section class="card flush col-main"><div class="head"><h2>All interactions with this company</h2><span style="font-size:12.5px;color:var(--muted)">Rolled up from every linked lead</span></div><div style="padding:18px 20px 6px">' + timeline(acts) + '</div></section><aside class="col-side"><section class="card"><h2>Activity summary</h2><dl class="kv" style="grid-template-columns:110px 1fr"><dt>Calls</dt><dd>' + cnt(acts, (a) => a.type === 'call') + '</dd><dt>Emails</dt><dd>' + cnt(acts, (a) => a.type === 'email') + '</dd><dt>Meetings</dt><dd>' + cnt(acts, (a) => a.type === 'meeting') + '</dd><dt>Quotations</dt><dd>' + cnt(acts, (a) => a.type === 'quote') + '</dd><dt>Last touch</dt><dd>' + (acts[0] ? rel(acts[0].at) : '—') + '</dd></dl></section><section class="card"><h2>Where this comes from</h2><div style="font-size:13px;color:var(--body);line-height:1.5">Activities are stored once, against the lead they belong to (lead_activities), and roll up here through the company relationship. Emails, calendar events and quotations keep their own tables and link by Lead, Contact and Company IDs.</div></section></aside></div>';
    else if (tab === 'ai') { const pending = runs.flatMap((r) => r.suggestions.filter((s) => !s.decision).map((s) => Object.assign({ runId: r.id }, s))); body = '<div class="cols"><div class="col-main">' + aiCard(c, true) + '<section class="card flush"><div class="head"><h2>Suggestions awaiting review ' + badge(pending.length, 'b-warn') + '</h2><span style="font-size:12.5px;color:var(--muted)">Accepting writes the value. Verified fields are locked and never overwritten.</span><div class="grow"></div>' + (pending.length ? '<button class="btn sm" data-act="accept-high">Accept all ≥ 80%</button>' : '') + '</div><div class="tbl"><table><thead><tr><th>Field</th><th>Current value</th><th>AI suggestion</th><th>Confidence</th><th>Source</th><th style="text-align:right">Decision</th></tr></thead><tbody>' + (pending.map((s) => { const locked = c.verified[s.field]; const cur = s.field === 'aiServices' ? (c.ai.services || []).join(', ') : c[s.field]; return '<tr><td><strong>' + esc(s.label) + '</strong></td><td class="wrap">' + (cur === null || cur === undefined || cur === '' ? '<span class="dim">NULL</span>' : esc(cur) + (locked ? okTag() : '')) + '</td><td class="wrap">' + esc(s.display || (Array.isArray(s.value) ? s.value.join(', ') : s.value)) + '</td><td>' + aiTag(s.confidence).replace('margin-left:6px', '') + '</td><td>' + esc(s.source) + '</td><td style="text-align:right">' + (locked ? '<span style="color:var(--muted);font-size:12.5px">Locked · verified</span>' : '<button class="btn xs" data-decide="' + s.runId + '|' + s.id + '|0">Reject</button> <button class="btn xs primary" data-decide="' + s.runId + '|' + s.id + '|1">Accept</button>') + '</td></tr>'; }).join('') || '<tr><td colspan="6" class="empty">Nothing waiting. Run AI research to generate suggestions for unverified fields.</td></tr>') + '</tbody></table></div></section><section class="card flush"><div class="head"><h2>Enrichment history <span style="font-size:12px;font-weight:500;color:var(--muted)">enrichment_history</span></h2></div><div class="tbl"><table><thead><tr><th>Run</th><th>Trigger</th><th>Engine</th><th>Sources</th><th>Result</th><th>Applied</th><th>Status</th></tr></thead><tbody>' + (runs.map((r) => '<tr><td>' + fmtDT(r.at) + '</td><td>' + esc(r.trigger) + '</td><td>' + esc(r.engine) + '</td><td class="wrap">' + esc(r.sources) + '</td><td class="wrap">' + esc(r.result) + '</td><td>' + (r.applied || 0) + '</td><td>' + badge(r.status) + '</td></tr>').join('') || '<tr><td colspan="7" class="empty">No research runs yet.</td></tr>') + '</tbody></table></div></section></div><aside class="col-side"><section class="card"><h2>AI classification</h2><dl class="kv" style="grid-template-columns:130px 1fr"><dt>Industry</dt><dd>' + dash(c.ai.industry) + '</dd><dt>Business category</dt><dd>' + dash(c.ai.category) + '</dd><dt>Opportunity score</dt><dd>' + (c.ai.score !== null ? c.ai.score + ' / 100' : '—') + '</dd><dt>Confidence</dt><dd>' + dash(c.ai.confidence) + '</dd><dt>Potential services</dt><dd>' + (pills(c.ai.services) || '<span class="dim">—</span>') + '</dd></dl></section>' + engineCard() + '</aside></div>'; }

    function aiCard(c, big) { const score = c.ai.score; return '<section class="card" style="border:1px dashed var(--peach);background:#FFFBF4"><h2><span class="pill">G</span>AI business intelligence</h2><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="score" style="background:conic-gradient(#822CDB 0 ' + (score || 0) + '%, var(--line) ' + (score || 0) + '% 100%)"><div style="background:#FFFBF4">' + (score === null ? '—' : score) + '</div></div><div style="font-size:13px;flex:1 1 180px"><div style="font-weight:600">Opportunity score ' + (score === null ? 'not yet computed' : score + ' / 100') + '</div><div style="color:var(--muted);margin-top:3px">Confidence <strong style="color:var(--warn-fg)">' + esc(c.ai.confidence || '—') + '</strong> · Research ' + badge(c.ai.status) + '</div><div style="color:var(--muted);margin-top:3px">Last research ' + (c.ai.lastRun ? fmtDT(c.ai.lastRun) : 'never') + ' · ' + badge(c.ai.verification) + '</div></div>' + (big ? '<div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary" data-act="research">Re-run research</button><button class="btn" data-act="verify-all">Mark profile verified</button></div>' : '') + '</div>' + (c.ai.summary ? '<div class="note" style="background:#fff;border:1px solid #F6D0B2;color:var(--body);font-size:13px"><strong>AI company summary.</strong> ' + esc(c.ai.summary) + '</div>' : '<div class="note info">No AI summary yet. Run research to generate one.</div>') + (big ? '' : '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm" href="#/companies/' + c.id + '/ai">Review suggestions</a><button class="btn sm" data-act="research">Run research</button></div>') + '<div style="font-size:11.5px;color:var(--muted)">Engine: pluggable (Ollama self-hosted or Claude API). Suggestions are stored in enrichment_history and applied only to unverified fields.</div></section>'; }
    function engineCard() { const e = db().config.enrichment; const sw = (k, label) => '<label class="sw"><input type="checkbox" data-src="' + k + '"' + (e.sources[k] ? ' checked' : '') + '> ' + label + '</label>'; return '<section class="card"><h2>Enrichment engine <span class="badge b-grey">admin</span></h2><div style="font-size:12.5px;color:var(--muted)">Modular providers. Switching never changes the data model.</div><div style="display:flex;flex-direction:column;gap:10px"><label class="sw"><input type="radio" name="engine" value="ollama"' + (e.engine === 'ollama' ? ' checked' : '') + '> <span><strong>Ollama</strong> · self-hosted on the CRM server (' + esc(e.model) + ')</span></label><label class="sw"><input type="radio" name="engine" value="claude"' + (e.engine === 'claude' ? ' checked' : '') + '> <span><strong>Claude API</strong> · intelligence + web search</span></label><div style="height:1px;background:var(--line-2)"></div>' + sw('website', 'Public company website') + sw('places', 'Google Places API (approved)') + sw('apollo', 'Apollo.io organisation enrichment') + sw('websearch', 'Web search') + '</div><div style="font-size:12px;color:var(--muted);line-height:1.5">Credentials live in server environment variables, never in the browser or public site.</div></section>'; }
    const html = header + '<div class="page">' + body + '</div>';
    return { html, mount(el) {
      const act = (name, fn) => el.querySelectorAll('[data-act=' + name + ']').forEach((b) => b.addEventListener('click', fn));
      act('research', () => { toast('Enrichment job queued · running in background'); setTimeout(() => { const r = Store.runEnrichment(id); toast('AI research completed · ' + r.suggestions.length + ' suggestions to review'); if (tab !== 'ai') location.hash = '#/companies/' + id + '/ai'; }, 900); });
      act('edit', () => V.companyModal(c));
      act('verify-all', () => { Store.verifyAll(id); toast('All filled fields marked verified'); });
      act('accept-high', () => { let n = 0; runs.forEach((r) => r.suggestions.filter((s) => !s.decision && s.confidence >= 80).forEach((s) => { Store.decideSuggestion(r.id, s.id, true); n++; })); toast(n + ' suggestions accepted'); });
      act('contact', () => V.contactModal(id));
      act('newproject', () => V.projectModal({ companyId: id }));

      act('location', () => V.locationModal(id));
      act('source', () => modal('<h2>Add research source</h2><div><label class="lbl">Title</label><input class="in" name="title"></div><div><label class="lbl">URL</label><input class="in" name="url" type="url"></div><div class="grid2"><div><label class="lbl">Type</label><select class="in" name="type">' + opts(['Company website', 'Business directory', 'Public registry', 'Social profile', 'Google Places API', 'Other']) + '</select></div><div><label class="lbl">Fields populated</label><input class="in" name="fields"></div></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Add</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { const d = form(bg); if (!d.title) return; db().sources.push({ id: Store.uid('SR'), companyId: id, title: d.title, url: d.url || null, type: d.type, at: Store.now(), by: Store.currentUser().name + ' (manual)', fields: d.fields || '—', confidence: 'Manual', snapshot: null }); Store.save(); close(); toast('Source recorded'); })));
      el.querySelectorAll('[data-decide]').forEach((b) => b.addEventListener('click', () => { const [runId, sid, ok] = b.dataset.decide.split('|'); const s = Store.decideSuggestion(runId, sid, ok === '1'); toast(s.decision === 'blocked' ? 'Field is verified · not overwritten' : (ok === '1' ? 'Accepted · ' + s.label + ' updated (marked AI-sourced)' : 'Rejected'), s.decision === 'blocked' ? 'warn' : 'ok'); }));
      el.querySelectorAll('[data-verify]').forEach((b) => b.addEventListener('click', () => { Store.verifyField(id, b.dataset.verify); toast('Field verified'); }));
      el.querySelectorAll('[data-verify-loc]').forEach((b) => b.addEventListener('click', () => { const L = db().locations.find((x) => x.id === b.dataset.verifyLoc); L.verified = true; L.source += ' · verified by ' + Store.currentUser().name; Store.save(); toast('Location verified'); }));
      el.querySelectorAll('[data-edit-contact]').forEach((b) => b.addEventListener('click', () => V.contactModal(id, Store.contact(b.dataset.editContact))));
      el.querySelectorAll('[name=engine]').forEach((r) => r.addEventListener('change', () => { db().config.enrichment.engine = r.value; Store.save(); toast('Engine set to ' + (r.value === 'ollama' ? 'Ollama' : 'Claude API')); }));
      el.querySelectorAll('[data-src]').forEach((cb) => cb.addEventListener('change', () => { db().config.enrichment.sources[cb.dataset.src] = cb.checked; Store.save(); }));
    } };
  };

  V.contactModal = function (companyId, existing) {
    const x = existing || {}; const cfg = db().config;
    modal('<h2>' + (existing ? 'Edit contact' : 'Add contact') + '</h2><div style="font-size:12.5px;color:var(--muted)">Section F fields · saved to the contacts table against ' + companyId + '</div><div class="grid2"><div><label class="lbl">First name *</label><input class="in" name="firstName" value="' + esc(x.firstName || '') + '"></div><div><label class="lbl">Last name *</label><input class="in" name="lastName" value="' + esc(x.lastName || '') + '"></div><div><label class="lbl">Designation</label><input class="in" name="designation" value="' + esc(x.designation || '') + '"></div><div><label class="lbl">Department</label><input class="in" name="department" value="' + esc(x.department || '') + '"></div><div class="span2"><label class="lbl">Business email</label><input class="in" name="email" type="email" value="' + esc(x.email || '') + '"></div><div><label class="lbl">Phone number</label><input class="in" name="phone" value="' + esc(x.phone || '') + '"></div><div><label class="lbl">Mobile number</label><input class="in" name="mobile" value="' + esc(x.mobile || '') + '"></div><div class="span2"><label class="lbl">LinkedIn profile</label><input class="in" name="linkedin" type="url" value="' + esc(x.linkedin || '') + '"></div><div><label class="lbl">Contact type</label><select class="in" name="type">' + opts(cfg.contactTypes, x.type || 'Other') + '</select></div><div><label class="lbl">Primary contact</label><select class="in" name="primary">' + opts([{ value: 'no', label: 'No' }, { value: 'yes', label: 'Yes' }], x.primary ? 'yes' : 'no') + '</select></div></div><div id="ctDup"></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Save contact</button></div>', (bg, close) => {

      bg.querySelectorAll('input').forEach((i) => i.addEventListener('input', check));

    });

); toast('Location added'); }));
  };
})();

<script>
/* Contact Enquiries: immutable website submissions, processing trace, links to Lead / Contact / Company, manual review. */
(function () {
  const { esc, dash, fmtDT, badge, enqBadge, modal, toast, form, opts, I } = UI;
  const db = () => Store.db;
  V.enquiries = function (id, q) {
    q = q || {};
    const all = db().enquiries.slice().sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1));
    const tab = q.tab || 'all';
    const groups = { all: () => true, processed: (e) => e.status.startsWith('Processed'), pending: (e) => e.status.startsWith('Enrichment') || e.status === 'Received', review: (e) => e.status === 'Needs review', spam: (e) => e.status === 'Spam' };
    let rows = all.filter(groups[tab] || groups.all);
    if (q.s) { const s = q.s.toLowerCase(); rows = rows.filter((e) => [e.id, e.fullName, e.email, e.companyName].join(' ').toLowerCase().includes(s)); }
    const sel = (id && all.find((e) => e.id === id)) || rows[0] || null;
    const T = (k, label, n, cls) => '<a class="tab' + (tab === k ? ' on' : '') + '" href="#/enquiries' + (sel ? '/' + sel.id : '') + '?' + qs({ tab: k === 'all' ? '' : k, s: q.s }) + '">' + label + ' <span class="n ' + (cls || '') + '">' + n + '</span></a>';
    const html = topbar('Contact Enquiries', 'Every submission from the daitpartners.com Contact Us form, stored as an immutable record', '<label class="search">' + I.search + '<span class="sr">Search enquiries</span><input type="search" name="s" value="' + esc(q.s || '') + '" placeholder="Search name, email, company…"></label><a class="btn" href="contact-form.html" target="_blank" rel="noopener">Open public form ↗</a>') +
      '<div class="page cols"><div class="card flush col-main"><div class="tabs">' + T('all', 'All', all.length) + T('processed', 'Processed', all.filter(groups.processed).length) + T('pending', 'Enrichment pending', all.filter(groups.pending).length) + T('review', 'Needs review', all.filter(groups.review).length, 'bad') + T('spam', 'Spam', all.filter(groups.spam).length) + '</div><div class="tbl"><table><thead><tr><th>Enquiry ID</th><th>Name</th><th>Email</th><th>Company</th><th>Phone</th><th>Requirement</th><th>Submitted</th><th>Processing status</th><th>Lead</th></tr></thead><tbody>' +
      (rows.map((e) => '<tr' + (sel && sel.id === e.id ? ' class="sel"' : '') + '><td><a href="#/enquiries/' + e.id + '?' + qs({ tab: q.tab, s: q.s }) + '" style="font-weight:600">' + e.id + '</a></td><td>' + esc(e.fullName) + '</td><td>' + esc(e.email) + '</td><td>' + esc(e.companyName) + '</td><td>' + dash(e.phone) + '</td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">' + esc(e.message) + '</td><td>' + fmtDT(e.submittedAt) + '</td><td>' + enqBadge(e.status) + '</td><td>' + (e.leadId ? '<a href="#/leads/' + e.leadId + '" style="font-weight:600">' + e.leadId + '</a>' : '<span class="dim">' + (e.status === 'Spam' ? '—' : 'Pending') + '</span>') + '</td></tr>').join('') || '<tr><td colspan="9" class="empty">No enquiries.</td></tr>') + '</tbody></table></div></div>' +
      (sel ? '<aside class="col-side" style="max-width:420px"><section class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2>' + sel.id + '</h2>' + badge('🔒 Original submission · read only', 'b-grey') + '</div><dl class="kv" style="grid-template-columns:120px 1fr"><dt>Full name</dt><dd>' + esc(sel.fullName) + '</dd><dt>Business email</dt><dd>' + esc(sel.email) + '</dd><dt>Phone</dt><dd>' + dash(sel.phone) + '</dd><dt>Company name</dt><dd>' + esc(sel.companyName) + '</dd><dt>Company website</dt><dd>' + dash(sel.website) + '</dd><dt>Requirement</dt><dd style="font-weight:400;color:var(--body);line-height:1.5">' + esc(sel.message) + '</dd><dt>Submitted</dt><dd>' + fmtDT(sel.submittedAt) + '</dd><dt>Source page</dt><dd>' + esc(sel.sourcePage) + '</dd><dt>Spam check</dt><dd>' + badge(sel.spamCheck, sel.spamCheck.startsWith('Passed') ? 'b-ok' : 'b-bad') + ' <span style="color:var(--muted);font-weight:400">honeypot + rate limit + token</span></dd></dl><div class="note info">Later edits to the company or contact never change this record.</div></section>' +
      (sel.status === 'Needs review' ? '<section class="card" style="border-color:var(--bad-fg)"><h2>Manual review required</h2><div style="font-size:13px;color:var(--body)">The company name matched more than one record and no domain was available. Choose the right company or create a new one; a lead is created only after you decide.</div><div><label class="lbl">Link to company</label><select class="in" name="reviewCompany">' + (sel.reviewCandidates || []).map((c) => { const idm = (c.match(/\((CO-\d+)\)/) || [])[1]; const real = idm && Store.company(idm); return '<option value="' + (real ? real.id : 'new') + '">' + esc(c) + (real ? '' : ' · not in prototype DB') + '</option>'; }).join('') + opts(db().companies.map((c) => ({ value: c.id, label: c.id + ' · ' + c.name }))) + '<option value="new">Create a new company</option></select></div><div class="actions" style="display:flex;gap:10px;justify-content:flex-end"><button class="btn primary" data-act="resolve">Confirm and create lead</button></div></section>' : '') +
      '<section class="card"><h2>Processing trace</h2><ol style="margin:0;padding-left:18px;font-size:13px;color:var(--body);display:flex;flex-direction:column;gap:8px">' + sel.trace.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ol></section>' +
      '<section class="card"><h2>Linked records</h2><div style="display:flex;flex-direction:column;gap:8px">' + (sel.leadId ? '<a class="link" href="#/leads/' + sel.leadId + '"><span>Lead · ' + sel.leadId + '</span><span style="color:var(--muted)">' + esc((Store.lead(sel.leadId) || {}).status || '') + '</span></a>' : '<div class="link"><span>Lead</span><span class="dim">not created yet</span></div>') + (sel.contactId ? '<a class="link" href="#/companies/' + sel.companyId + '/contacts"><span>Contact · ' + sel.contactId + ' ' + esc(Store.contactName(sel.contactId) || '') + '</span><span style="color:var(--muted)">matched / created</span></a>' : '') + (sel.companyId ? '<a class="link" href="#/companies/' + sel.companyId + '"><span>Company · ' + sel.companyId + ' ' + esc((Store.company(sel.companyId) || {}).name || '') + '</span><span style="color:var(--muted)">matched / created</span></a>' : '') + '</div></section></aside>' : '') + '</div>';
    return { html, mount(el) {
      const search = el.querySelector('input[name=s]'); search.addEventListener('change', () => { location.hash = '#/enquiries?' + qs({ tab: q.tab, s: search.value }); });
      const r = el.querySelector('[data-act=resolve]'); if (r) r.addEventListener('click', () => { const cid = el.querySelector('[name=reviewCompany]').value; const l = Store.resolveEnquiry(sel.id, cid); toast('Lead ' + l.id + ' created from ' + sel.id); location.hash = '#/leads/' + l.id; });
    } };
  };
})();

</script>
<script>
/* Dashboard, Tasks, Email, Calendar, Quotations. */
(function () {
  const { esc, dash, fmtDate, fmtDT, rel, badge, prio, userLabel, opts, I, modal, toast, form, tile } = UI;
  const db = () => Store.db;
  const taskRow = (t) => '<label class="task' + (Store.isOverdue(t) ? ' over' : '') + (t.done ? ' done' : '') + '"><input type="checkbox" data-task="' + t.id + '"' + (t.done ? ' checked' : '') + '><span class="grow"><strong>' + esc(t.title) + '</strong><span class="m">' + (Store.isOverdue(t) ? 'Overdue · ' : Store.isToday(t) ? 'Today · ' : fmtDate(t.due) + ' · ') + (t.leadId ? '<a href="#/leads/' + t.leadId + '">' + t.leadId + '</a> · ' : '') + esc(t.origin) + ' · ' + esc(Store.userName(t.assignedTo)) + '</span></span>' + (Store.isOverdue(t) ? badge('Overdue', 'b-bad') : Store.isToday(t) ? badge('Today', 'b-purple') : badge('Upcoming', 'b-grey')) + '</label>';
  const bindTasks = (el) => el.querySelectorAll('[data-task]').forEach((cb) => cb.addEventListener('change', () => { Store.toggleTask(cb.dataset.task); }));

  /* ---------- Dashboard ---------- */
  V.dashboard = function () {
    const me = Store.currentUser(); const t = Store.today();
    const my = db().tasks.filter((x) => x.assignedTo === me.id && !x.done).sort((a, b) => (a.due > b.due ? 1 : -1));
    const myLeads = db().leads.filter((l) => l.assignedTo === me.id && !l.archived && !['Won', 'Lost', 'Not Relevant'].includes(l.status));
    const todayEv = db().events.filter((e) => e.date === t).sort((a, b) => (a.start > b.start ? 1 : -1));
    const notes = db().notifications.filter((n) => n.userId === me.id).slice(0, 5);
    const myQuotes = db().quotes.filter((x) => x.ownerId === me.id && ['Sent', 'Negotiating'].includes(x.status));
    const byStatus = db().config.leadStatuses.slice(0, 7).map((s) => [s, myLeads.filter((l) => l.status === s).length]); const max = Math.max(1, ...byStatus.map((x) => x[1]));
    const html = topbar('Good afternoon, ' + esc(me.name.split(' ')[0]), 'Wednesday 18 November 2026 · everything assigned to you across leads, email, calendar and quotations', '<button class="btn" data-act="notes" style="position:relative" aria-label="Notifications">🔔' + (Store.counts.notifications(me.id) ? '<span class="badge b-warn" style="position:absolute;top:-6px;right:-6px;font-size:10px;padding:1px 6px">' + Store.counts.notifications(me.id) + '</span>' : '') + '</button><a href="#/leads/new" class="btn primary">' + I.plus + 'New lead</a>') +
      '<div class="page"><div class="tiles">' + tile('My open leads', myLeads.length, myLeads.filter((l) => l.createdAt.slice(0, 10) >= Store.addDays(t, -1)).length + ' new since yesterday', '', '#/leads?tab=mine') + tile('Follow-ups due today', my.filter(Store.isToday).length, my.filter(Store.isOverdue).length + ' overdue', 'bad', '#/tasks') + tile('Meetings today', todayEv.length, todayEv.find((e) => e.start > '14:00') ? 'next at ' + todayEv.find((e) => e.start > '14:00').start + ' · ' + esc(todayEv.find((e) => e.start > '14:00').title) : '—', '', '#/calendar') + tile('Quotes awaiting response', myQuotes.length, myQuotes.map((x) => Store.fmtMoney(Store.quoteTotals(x).total, x.currency)).join(' · ') || '—', '', '#/quotes') + '</div>' +
      '<div class="cols"><section class="card" style="flex:1 1 380px;min-width:0"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Tasks &amp; follow-ups</h2><div style="display:flex;gap:6px">' + badge(my.filter(Store.isOverdue).length + ' overdue', 'b-bad') + badge(my.filter(Store.isToday).length + ' today', 'b-purple') + badge(my.filter((x) => !Store.isOverdue(x) && !Store.isToday(x)).length + ' upcoming', 'b-grey') + '</div></div><div style="display:flex;flex-direction:column;gap:8px">' + (my.slice(0, 6).map(taskRow).join('') || '<div class="empty">Nothing due. Nice.</div>') + '</div><a href="#/tasks" style="font-size:13px;font-weight:600">View all ' + my.length + ' tasks</a></section>' +
      '<div style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px"><section class="card"><div style="display:flex;align-items:center;justify-content:space-between"><h2>Today\'s agenda</h2><a href="#/calendar" style="font-size:12.5px;font-weight:600">Open calendar</a></div><div style="display:flex;flex-direction:column;gap:8px;font-size:13px">' + (todayEv.map((e) => '<div style="display:flex;gap:12px;align-items:flex-start"><span style="width:48px;flex:0 0 auto;color:var(--muted);font-weight:600">' + e.start + '</span><span style="border-left:3px solid ' + (e.type === 'call' ? '#BA5326' : e.type === 'internal' ? '#6A5E86' : '#822CDB') + ';padding-left:10px"><strong>' + esc(e.title) + '</strong><span style="display:block;color:var(--muted);font-size:12px">' + esc(e.attendees) + (e.where ? ' · ' + esc(e.where) : '') + (e.leadId ? ' · <a href="#/leads/' + e.leadId + '">' + e.leadId + '</a>' : '') + (e.done ? ' · done' : '') + '</span></span></div>').join('') || '<div style="color:var(--muted)">No events today.</div>') + '</div></section>' +
      '<section class="card"><h2>Notifications</h2><div style="display:flex;flex-direction:column;gap:10px;font-size:13px">' + (notes.map((n) => '<a href="' + n.link + '" style="display:flex;gap:10px;color:var(--text)"><span style="width:8px;height:8px;border-radius:50%;background:' + (n.read ? 'var(--field)' : 'var(--peach)') + ';flex:0 0 auto;margin-top:6px"></span><span><strong>' + esc(n.text) + '</strong><span style="display:block;color:var(--muted);font-size:12px">' + rel(n.at) + (n.detail ? ' · ' + esc(n.detail) : '') + '</span></span></a>').join('') || '<div style="color:var(--muted)">No notifications.</div>') + '</div></section></div>' +
      '<section class="card" style="flex:1 1 280px;min-width:0;max-width:360px"><h2>My pipeline by status</h2><div style="display:flex;flex-direction:column;gap:9px;font-size:12.5px">' + byStatus.map(([s, n], i) => '<div><div style="display:flex;justify-content:space-between"><span>' + esc(s) + '</span><strong>' + n + '</strong></div><div class="bar"><div style="width:' + Math.round(n / max * 100) + '%;background:' + (i > 3 ? '#BA5326' : '#822CDB') + '"></div></div></div>').join('') + '</div><div style="font-size:12px;color:var(--muted)">Won: ' + db().leads.filter((l) => l.assignedTo === me.id && l.status === 'Won').length + ' · Lost: ' + db().leads.filter((l) => l.assignedTo === me.id && l.status === 'Lost').length + '</div></section></div></div>';
    return { html, mount(el) { bindTasks(el); el.querySelector('[data-act=notes]').addEventListener('click', () => { location.hash = '#/notifications'; }); } };
  };

  /* ---------- Tasks ---------- */
  V.tasks = function (q) {
    const me = Store.currentUser(); const scope = q.scope || 'mine';
    let list = db().tasks.filter((x) => scope === 'all' || x.assignedTo === me.id);
    const open = list.filter((x) => !x.done).sort((a, b) => (a.due > b.due ? 1 : -1)); const done = list.filter((x) => x.done);
    const html = topbar('Tasks', 'Pending and overdue follow-ups, new assignments and transferred leads', '<a class="btn' + (scope === 'mine' ? ' primary' : '') + '" href="#/tasks">My tasks</a><a class="btn' + (scope === 'all' ? ' primary' : '') + '" href="#/tasks?scope=all">Team</a>') +
      '<div class="page cols"><section class="card col-main"><h2>Overdue ' + badge(open.filter(Store.isOverdue).length, 'b-bad') + '</h2><div style="display:flex;flex-direction:column;gap:8px">' + (open.filter(Store.isOverdue).map(taskRow).join('') || '<div style="color:var(--muted);font-size:13px">None.</div>') + '</div><h2>Due today ' + badge(open.filter(Store.isToday).length, 'b-purple') + '</h2><div style="display:flex;flex-direction:column;gap:8px">' + (open.filter(Store.isToday).map(taskRow).join('') || '<div style="color:var(--muted);font-size:13px">None.</div>') + '</div><h2>Upcoming</h2><div style="display:flex;flex-direction:column;gap:8px">' + (open.filter((x) => !Store.isOverdue(x) && !Store.isToday(x)).map(taskRow).join('') || '<div style="color:var(--muted);font-size:13px">None.</div>') + '</div></section><aside class="col-side"><section class="card"><h2>Completed</h2><div style="display:flex;flex-direction:column;gap:8px">' + (done.map(taskRow).join('') || '<div style="color:var(--muted);font-size:13px">None yet.</div>') + '</div></section><section class="card"><h2>How tasks get here</h2><ul style="margin:0;padding-left:18px;font-size:13px;color:var(--body);display:flex;flex-direction:column;gap:6px"><li>Lead assigned or transferred to you</li><li>Follow-up date set on a lead</li><li>Added manually on a lead, email or meeting</li><li>Quotation revision requested</li></ul></section></aside></div>';
    return { html, mount: bindTasks };
  };

  /* ---------- Email ---------- */
  V.email = function (id, q) {
    q = q || {}; const me = Store.currentUser(); const folder = q.folder || 'inbox';
    if (id === 'compose') { setTimeout(() => V.compose({ contactId: q.to }), 0); id = null; }
    let list = db().emails.filter((e) => (folder === 'unlinked' ? !e.leadId : folder === 'awaiting' ? e.folder === 'sent' : folder === 'mine' ? e.leadId && (Store.lead(e.leadId) || {}).assignedTo === me.id : e.folder === folder)).sort((a, b) => (a.at < b.at ? 1 : -1));
    const fq = { folder, company: q.company || '', lead: q.lead || '', project: q.project || '' };
    if (fq.project) list = list.filter((e) => e.projectId === fq.project);
    if (fq.company) list = list.filter((e) => e.companyId === fq.company || (e.leadId && (Store.lead(e.leadId) || {}).companyId === fq.company));
    if (fq.lead) list = list.filter((e) => e.leadId === fq.lead);
    if (q.s) { const s = q.s.toLowerCase(); fq.s = q.s; list = list.filter((e) => [e.subject, e.from, e.fromEmail, e.to, e.body].join(' ').toLowerCase().includes(s)); }
    const sel = (id && db().emails.find((e) => e.id === id)) || list[0] || null;
    if (sel && sel.unread) setTimeout(() => Store.markRead(sel.id), 400);
    const clientOpts = db().companies.slice().sort((a, b) => a.name.localeCompare(b.name)).map((c) => ({ value: c.id, label: (c.legalName || c.name) + (c.isClient ? ' · client' : '') }));
    const leadOpts = db().leads.filter((l) => !l.archived && (!fq.company || l.companyId === fq.company)).map((l) => ({ value: l.id, label: l.id + ' · ' + l.companyName + (l.contactId ? ' · ' + Store.contactName(l.contactId) : '') }));
    const projOpts = db().projects.filter((p) => !fq.company || p.companyId === fq.company).map((p) => ({ value: p.id, label: p.id + ' · ' + p.name }));
    const F = (k, label, n, hot) => '<a class="fold' + (folder === k ? ' on' : '') + '" href="#/email?' + qs(Object.assign({}, fq, { folder: k })) + '">' + label + (n ? '<span class="cnt' + (hot ? '' : '') + '"' + (hot ? ' style="background:var(--peach);color:var(--ink)"' : '') + '>' + n + '</span>' : '') + '</a>';
    const sl = sel && sel.leadId ? Store.lead(sel.leadId) : null;
    const acct = Store.accountFor(me.id);
    const html = topbar('Email', acct ? esc(acct.address) + ' · ' + (acct.provider === 'microsoft' ? 'Microsoft 365' : acct.provider === 'google' ? 'Google Workspace' : 'IMAP/SMTP') + ' ' + badge('Connected', 'b-ok') + ' · synced ' + rel(acct.lastSync) + ' · every thread links to a Lead, Contact and Company' : esc(me.email) + ' · ' + badge('Mailbox not connected', 'b-warn'), (acct ? '<button class="btn" data-act="sync">Sync now</button>' : '<a class="btn" href="#/settings">Connect Microsoft 365</a>') + '<button class="btn primary" data-act="compose">+ Compose</button>') +
      (acct ? '' : '<div style="margin:16px 28px 0;padding:12px 16px;border:1px solid #F0C98A;background:#FFF8EC;border-radius:10px;font-size:13px;color:var(--body);display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span><strong>Connect your mailbox to send and receive from the CRM.</strong> Your Microsoft 365 Business Basic account works out of the box; sign in once and the CRM syncs mail and calendar through Microsoft Graph.</span><div class="grow"></div><button class="btn primary" data-act="connectms">Connect Microsoft 365</button></div>') +
      '<div class="filters" style="background:var(--surface);padding:10px 28px;border-bottom:1px solid var(--line)"><span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px">Show mail for</span><select class="chip" name="fCompany" aria-label="Client / company" style="width:260px" data-search>' + opts(clientOpts, fq.company, 'Client: all') + '</select><select class="chip" name="fLead" aria-label="Lead" style="width:260px" data-search>' + opts(leadOpts, fq.lead, fq.company ? 'Lead: all for this client' : 'Lead: all') + '</select>' + '<select class="chip" name="fProject" aria-label="Project" style="width:240px" data-search>' + opts(projOpts, fq.project, fq.company ? 'Project: all for this client' : 'Project: all') + '</select>' + (fq.company || fq.lead || fq.project ? '<a class="btn sm" href="#/email?folder=' + folder + '">✕ Clear</a>' : '') + '<div class="grow"></div><label class="search" style="height:34px;width:300px">' + I.search + '<span class="sr">Search mail</span><input type="search" name="fs" value="' + esc(q.s || '') + '" placeholder="Search subject, sender, text…"></label></div>' +

<script>
/* Calendar (follow-ups first) and Notifications.
   Calendar: mini month + overdue list on the left; Day / Week / Month on the right. It shows follow-up tasks
   (all-day or timed) together with calls and meetings. Click an empty day to add one; click an item to open its lead.
   Notifications: everything the CRM has told the acting user, newest first, with a live "needs attention" strip. */
(function () {
  const { esc, badge, opts, I, modal, toast, form } = UI;
  const db = () => Store.db;
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const p2 = (n) => String(n).padStart(2, '0');
  const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const dow = (d) => (new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7; // Monday = 0; UTC so the computer's time zone cannot shift the day
  const monthStart = (d) => d.slice(0, 8) + '01';
  const addMonths = (d, n) => { const y = +d.slice(0, 4); const m = +d.slice(5, 7) - 1 + n; const dt = new Date(Date.UTC(y, m, 1)); return dt.getUTCFullYear() + '-' + p2(dt.getUTCMonth() + 1) + '-01'; };
  const dayNum = (d) => parseInt(d.slice(8), 10);
  const short = (d) => DAYS[dow(d)].slice(0, 3) + ' ' + dayNum(d) + ' ' + MONTHS[+d.slice(5, 7) - 1].slice(0, 3);
  const qs = (o) => Object.keys(o).filter((k) => o[k]).map((k) => k + '=' + encodeURIComponent(o[k])).join('&');
  const CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  /* Everything that sits on the calendar, in one shape. */
  function items(who, me) {
    const t = Store.today(); const out = [];
    db().tasks.filter((x) => x.due && (who === 'all' || x.assignedTo === me.id)).forEach((x) => { const l = x.leadId ? Store.lead(x.leadId) : null; out.push({ kind: 'task', id: x.id, date: x.due, time: x.time || '', title: x.title, done: !!x.done, over: !x.done && x.due < t, leadId: x.leadId, company: l ? l.companyName : '', owner: x.assignedTo, type: 'followup' }); });
    db().events.filter((e) => e.type !== 'task' ? true : true).filter((e) => who === 'all' || e.organiser === me.id || (e.attendeeIds || []).includes(me.id) || (e.attendees || '').includes(me.name)).forEach((e) => { const l = e.leadId ? Store.lead(e.leadId) : null; out.push({ kind: 'event', id: e.id, date: e.date, time: e.start || '', end: e.end || '', title: e.title, done: !!e.done, over: false, leadId: e.leadId, company: l ? l.companyName : (e.note || ''), owner: e.organiser, type: e.type || 'meeting', where: e.where || '' }); });

    } };
  };

<script>

(function () {

    const row = (a) => '<div style="display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap"><span style="width:36px;height:36px;border-radius:8px;background:#F3F6FB;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto">' + (a.provider === 'microsoft' ? msLogo : '<span style="font-weight:800;color:' + PROV[a.provider][1] + '">' + PROV[a.provider][0][0] + '</span>') + '</span><div style="min-width:0;flex:1 1 220px"><div style="font-weight:700">' + esc(a.address) + ' <span style="font-weight:500;color:var(--muted)">· ' + esc(Store.userName(a.userId)) + '</span></div><div style="font-size:12.5px;color:var(--muted)">' + esc(PROV[a.provider][0]) + (a.tenant ? ' · ' + esc(a.tenant) : '') + ' · ' + badge('Connected', 'b-ok') + ' · synced ' + rel(a.lastSync) + ' · ' + (a.messages || 0).toLocaleString() + ' messages</div><div style="font-size:12px;color:var(--body);margin-top:4px">' + (a.syncMail ? '✓ Mail' : '– Mail') + ' &nbsp; ' + (a.syncCalendar ? '✓ Calendar (two-way)' : '– Calendar') + (a.sharedMailboxes && a.sharedMailboxes.length ? ' &nbsp; ✓ Shared: ' + esc(a.sharedMailboxes.join(', ')) : '') + '</div></div><div style="display:flex;gap:6px"><button class="btn sm" data-sync="' + a.id + '">Sync now</button><button class="btn sm" data-edit="' + a.id + '">Options</button><button class="btn sm danger" data-disc="' + a.id + '">Disconnect</button></div></div>';

      (isAdmin ? '<details style="font-size:12.5px;color:var(--body)"><summary style="cursor:pointer;font-weight:600">Administrator: Microsoft 365 app registration (one-time)</summary><div style="margin-top:8px;line-height:1.6">1. In Microsoft Entra admin centre, register an app "DAIT CRM" (single tenant). 2. Redirect URI: <code>https://crm.daitpartners.com/api/auth/microsoft/callback</code>. 3. Delegated Graph permissions: Mail.ReadWrite, Mail.Send, Calendars.ReadWrite, User.Read, offline_access; grant admin consent once so users are not asked individually. 4. Put the client id, secret and tenant id in the server environment (<code>MS_CLIENT_ID</code>, <code>MS_CLIENT_SECRET</code>, <code>MS_TENANT_ID</code>). Nothing is stored in the browser.</div></details>' : '') + '</section>';
  };

    const o = el.querySelector('[data-act=connect-other]'); if (o) o.addEventListener('click', () => V.connectModal(null));
    el.querySelectorAll('[data-sync]').forEach((x) => x.addEventListener('click', () => { Store.syncMailbox(x.dataset.sync); toast('Mailbox synced · 1 new message linked to a lead'); }));
    el.querySelectorAll('[data-disc]').forEach((x) => x.addEventListener('click', () => modal('<h2>Disconnect mailbox?</h2><p style="margin:0;font-size:13px;color:var(--body)">The CRM stops syncing and sending through this account and deletes its tokens. Emails already linked to leads stay in the CRM.</p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn danger" data-go>Disconnect</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { Store.disconnectMailbox(x.dataset.disc); close(); toast('Mailbox disconnected'); }))));
    el.querySelectorAll('[data-edit]').forEach((x) => x.addEventListener('click', () => { const a = db().emailAccounts.find((k) => k.id === x.dataset.edit); modal('<h2>Mailbox options · ' + esc(a.address) + '</h2><label class="sw"><input type="checkbox" name="syncMail"' + (a.syncMail ? ' checked' : '') + '> Sync mail (inbox and sent, last 90 days then continuous)</label><label class="sw"><input type="checkbox" name="syncCalendar"' + (a.syncCalendar ? ' checked' : '') + '> Sync calendar two-way (CRM meetings appear in Outlook, Outlook events appear here)</label><div><label class="lbl">Shared mailboxes to include</label><input class="in" name="shared" value="' + esc((a.sharedMailboxes || []).join(', ')) + '" placeholder="hello@daitpartners.com, sales@daitpartners.com"></div><div class="note info">Only messages from known contacts or company domains are linked to records automatically; everything else lands in "Unlinked".</div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Save</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { const d = form(bg); Store.updateMailbox(a.id, { syncMail: !!d.syncMail, syncCalendar: !!d.syncCalendar, sharedMailboxes: d.shared.split(',').map((s) => s.trim()).filter(Boolean) }); close(); toast('Options saved'); })); }));
  };

  /* Preferences: language per user */
  V.preferencesCard = function () {
    const me = Store.currentUser(); const cur = me.lang || 'en'; const df = UI.DATE_FORMATS.includes(me.dateFormat) ? me.dateFormat : 'auto'; const tz = me.timeZone || UI.BASE_TZ;
    let browserTz = null; try { browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { /* not available */ }
    const zones = UI.TIME_ZONES.slice(); [tz, browserTz].forEach((z) => { if (z && !zones.includes(z)) zones.push(z); });
    const dfOpt = (f) => '<option value="' + f + '"' + (f === df ? ' selected' : '') + '>' + esc(UI.fmtSample(f, cur)) + (f === 'auto' ? ' (from language)' : ' · ' + esc(f)) + '</option>';
    const tzOpt = (z) => { const off = UI.tzOffset(z); return '<option value="' + esc(z) + '"' + (z === tz ? ' selected' : '') + '>' + esc(z.replace(/_/g, ' ')) + (off ? ' (' + esc(off) + ')' : '') + (z === UI.BASE_TZ ? ' · office' : '') + (z === browserTz ? ' · this computer' : '') + '</option>'; };
    return '<section class="card" id="prefs"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2>Preferences</h2><span style="font-size:12.5px;color:var(--muted)">Saved per user. Language, date format and time zone apply immediately across the CRM.</span></div><div class="grid3"><div><label class="lbl" for="langSel">Language</label><select id="langSel" class="in" name="lang">' + Object.keys(I18N.LANGS).map((k) => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + I18N.LANGS[k] + (k === 'en' ? ' (default)' : '') + '</option>').join('') + '</select></div><div><label class="lbl" for="dfSel">Date format</label><select id="dfSel" class="in" name="dateFormat">' + UI.DATE_FORMATS.map(dfOpt).join('') + '</select></div><div><label class="lbl" for="tzSel">Time zone</label><select id="tzSel" class="in" name="timeZone" data-search>' + zones.map(tzOpt).join('') + '</select></div></div><div style="font-size:12.5px;color:var(--muted)">Preview · a call logged at 14:05 office time on ' + esc(UI.fmtSample('d MMM yyyy', 'en')) + ' shows as <strong style="color:var(--text)">' + esc(UI.fmtDT(Store.today() + 'T14:05:00')) + '</strong>. Follow-up and due dates are calendar days and do not shift with the time zone.</div></section>';
  };
  V.mountPreferences = function (el) {
    const s = el.querySelector('#langSel'); if (s) s.addEventListener('change', () => { Store.setLang(Store.currentUser().id, s.value); UI.toast({ en: 'Language set to English', es: 'Idioma cambiado a español', fr: 'Langue définie sur le français' }[s.value]); });
    const d = el.querySelector('#dfSel'); if (d) d.addEventListener('change', () => { Store.setPrefs(Store.currentUser().id, { dateFormat: d.value }); UI.toast('Date format updated'); });
    const z = el.querySelector('#tzSel'); if (z) z.addEventListener('change', () => { Store.setPrefs(Store.currentUser().id, { timeZone: z.value }); UI.toast('Time zone set to ' + z.value.replace(/_/g, ' ')); });
  };

  /* Email templates: written in the CRM or uploaded as Outlook .oft files */
  V.templatesCard = function () {
    const me = Store.currentUser(); const list = (db().templates || []).slice().sort((a, b) => (a.lang === b.lang ? a.name.localeCompare(b.name) : a.lang.localeCompare(b.lang)));
    const row = (x) => '<tr><td><strong>' + esc(x.name) + '</strong>' + (x.source === 'oft' ? '<span style="display:block;font-size:11.5px;color:var(--muted)">' + esc(x.fileName || 'Outlook template') + (x.size ? ' · ' + Math.round(x.size / 1024) + ' KB' : '') + '</span>' : '') + '</td><td>' + badge(x.source === 'oft' ? 'Outlook .oft' : 'Written here', x.source === 'oft' ? 'b-purple' : 'b-grey') + '</td><td>' + badge(I18N.LANGS[x.lang] || x.lang, 'b-grey') + '</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">' + esc(x.subject) + '</td><td style="color:var(--muted)">' + esc(Store.userName(x.createdBy)) + ' · ' + UI.fmtDate(x.at) + '</td><td style="white-space:nowrap"><button class="btn xs" data-tpl-edit="' + x.id + '">Edit</button> <button class="btn xs danger" data-tpl-del="' + x.id + '">Delete</button></td></tr>';
    return '<section class="card flush" id="templates"><div class="head"><h2>Email templates</h2><span style="font-size:12.5px;color:var(--muted)">Available in every compose box. Merge fields: {first_name} {company} {me} {quote_no} {lead_id}</span><div class="grow"></div><button class="btn sm" data-act="tpl-new">Write a template</button><label class="btn sm primary" style="cursor:pointer">Upload .oft template<input type="file" accept=".oft,.msg" data-act="tpl-upload" class="sr"></label></div><div class="tbl"><table><thead><tr><th>Template</th><th>Source</th><th>Language</th><th>Subject</th><th>Added</th><th></th></tr></thead><tbody>' + (list.map(row).join('') || '<tr><td colspan="6" class="empty">No templates yet.</td></tr>') + '</tbody></table></div><div class="foot">Save a message in Outlook as <strong>File → Save As → Outlook Template (*.oft)</strong>, then upload it here. The subject and body are read from the file; placeholders typed as {first_name} etc. are filled in when you use it. Templates in your language are listed first.</div></section>';
  };
  V.mountTemplates = function (el) {
    const me = Store.currentUser();
    const editor = (x) => modal('<h2>' + (x.id ? 'Edit template' : 'Write a template') + '</h2>' + (x.source === 'oft' ? '<div class="note info">Read from ' + esc(x.fileName) + '. You can tidy the text or add merge fields before saving.</div>' : '') + '<div class="grid2"><div><label class="lbl">Name</label><input class="in" name="name" value="' + esc(x.name || '') + '"></div><div><label class="lbl">Language</label><select class="in" name="lang">' + opts(Object.keys(I18N.LANGS).map((k) => ({ value: k, label: I18N.LANGS[k] })), x.lang || me.lang || 'en') + '</select></div><div class="span2"><label class="lbl">Subject</label><input class="in" name="subject" value="' + esc(x.subject || '') + '"></div><div class="span2"><label class="lbl">Body</label><textarea class="in" name="body" rows="9">' + esc(x.body || '') + '</textarea></div></div><div style="font-size:12px;color:var(--muted)">Merge fields: {first_name} {company} {me} {quote_no} {lead_id}</div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Save template</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { const d = form(bg); if (!d.name || !d.subject) { toast('Name and subject are required', 'warn'); return; } if (x.id) Store.updateTemplate(x.id, { name: d.name, lang: d.lang, subject: d.subject, body: d.body }); else Store.addTemplate({ name: d.name, lang: d.lang, subject: d.subject, body: d.body, source: x.source || 'manual', fileName: x.fileName, size: x.size }); close(); toast('Template saved'); }));
    const nb = el.querySelector('[data-act=tpl-new]'); if (nb) nb.addEventListener('click', () => editor({}));
    const up = el.querySelector('[data-act=tpl-upload]'); if (up) up.addEventListener('change', () => { const f = up.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { let parsed; try { parsed = OFT.parse(r.result); } catch (err) { toast(err.message + ' – you can still enter the text by hand', 'warn'); parsed = { subject: '', body: '' }; } editor({ name: f.name.replace(/\.(oft|msg)$/i, ''), subject: parsed.subject, body: parsed.body, source: 'oft', fileName: f.name, size: f.size, lang: me.lang || 'en' }); up.value = ''; }; r.readAsArrayBuffer(f); });
    el.querySelectorAll('[data-tpl-edit]').forEach((b) => b.addEventListener('click', () => editor(Object.assign({}, db().templates.find((x) => x.id === b.dataset.tplEdit)))));
    el.querySelectorAll('[data-tpl-del]').forEach((b) => b.addEventListener('click', () => { if (!confirm('Delete this template? This cannot be undone.')) return; Store.removeTemplate(b.dataset.tplDel); toast('Template deleted'); }));
  };

  /* Simulated Microsoft sign-in → consent → options. */
  V.connectModal = function (provider) {
    const me = Store.currentUser(); let step = provider ? 1 : 0; let prov = provider || 'microsoft';
    const render = (bg) => {
      const box = bg.querySelector('.modal');
      if (step === 0) box.innerHTML = '<h2>Connect a mailbox</h2><div style="display:flex;flex-direction:column;gap:8px">' + [['microsoft', 'Microsoft 365 / Outlook', 'Business Basic, Standard or Premium. Mail + calendar via Microsoft Graph. Recommended.'], ['google', 'Google Workspace / Gmail', 'Mail + calendar via Google APIs.'], ['imap', 'Other (IMAP / SMTP)', 'Mail only. Enter server details manually.']].map(([k, t, d]) => '<button class="btn" data-prov="' + k + '" style="height:auto;padding:12px 14px;justify-content:flex-start;text-align:left;gap:12px">' + (k === 'microsoft' ? msLogo : '<span style="width:18px;text-align:center;font-weight:800;color:' + PROV[k][1] + '">' + t[0] + '</span>') + '<span><strong>' + t + '</strong><span style="display:block;font-size:12px;color:var(--muted);font-weight:400">' + d + '</span></span></button>').join('') + '</div><div class="actions"><button class="btn" data-close>Cancel</button></div>';
      else if (step === 1 && prov === 'microsoft') box.innerHTML = '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">' + msLogo + ' login.microsoftonline.com · simulated for the prototype</div><div style="border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;font-family:\'Segoe UI\',Montserrat,sans-serif"><div style="font-size:20px;font-weight:600;color:#1B1B1B">Sign in</div><div><input class="in" name="msEmail" value="' + esc(me.email) + '" aria-label="Email, phone, or Skype"></div><div style="font-size:12.5px;color:#444"><a href="#" onclick="return false">Can\'t access your account?</a></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-back>Back</button><button class="btn" data-next style="background:#0F6CBD;border-color:#0F6CBD;color:#fff">Next</button></div></div><div style="font-size:12px;color:var(--muted)">Work or school account. Your password is entered on Microsoft\'s page, never in the CRM.</div>';
      else if (step === 1) box.innerHTML = '<h2>' + esc(PROV[prov][0]) + '</h2>' + (prov === 'google' ? '<div class="note info">Redirects to accounts.google.com for consent (gmail.modify, calendar.events).</div>' : '<div class="grid2"><div><label class="lbl">IMAP host</label><input class="in" name="imap" placeholder="imap.example.com"></div><div><label class="lbl">SMTP host</label><input class="in" name="smtp" placeholder="smtp.example.com"></div><div><label class="lbl">Username</label><input class="in" name="user" value="' + esc(me.email) + '"></div><div><label class="lbl">Password / app password</label><input class="in" type="password" name="pass"></div></div>') + '<div class="actions"><button class="btn" data-back>Back</button><button class="btn primary" data-next>Continue</button></div>';
      else if (step === 2 && prov === 'microsoft') box.innerHTML = '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">' + msLogo + ' login.microsoftonline.com · simulated for the prototype</div><div style="border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;font-family:\'Segoe UI\',Montserrat,sans-serif"><div style="font-size:12.5px;color:#444">' + esc(me.email) + '</div><div style="font-size:20px;font-weight:600;color:#1B1B1B">Permissions requested</div><div style="font-size:13px;color:#444"><strong>DAIT CRM</strong><br>daitpartners.com</div><div style="font-size:13px;color:#1B1B1B">This app would like to:</div><ul style="margin:0;padding-left:18px;font-size:13px;color:#1B1B1B;display:flex;flex-direction:column;gap:6px"><li>Read and write access to your mail <span style="color:#666">(Mail.ReadWrite)</span></li><li>Send mail as you <span style="color:#666">(Mail.Send)</span></li><li>Have full access to your calendars <span style="color:#666">(Calendars.ReadWrite)</span></li><li>Sign you in and read your profile <span style="color:#666">(User.Read)</span></li><li>Maintain access to data you have given it access to <span style="color:#666">(offline_access)</span></li></ul><div style="font-size:12px;color:#666">Accepting these permissions means that you allow this app to use your data as specified in their terms of service and privacy statement.</div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-back>Cancel</button><button class="btn" data-next style="background:#0F6CBD;border-color:#0F6CBD;color:#fff">Accept</button></div></div>';
      else box.innerHTML = '<h2>Almost done · ' + esc(PROV[prov][0]) + '</h2><div class="note ok">Signed in as <strong>' + esc(me.email) + '</strong>. Choose what to sync.</div><label class="sw"><input type="checkbox" name="syncMail" checked> Mail: inbox and sent items, last 90 days first, then continuous (Graph change notifications)</label><label class="sw"><input type="checkbox" name="syncCalendar"' + (prov === 'imap' ? ' disabled' : ' checked') + '> Calendar two-way: CRM meetings appear in Outlook, Outlook events appear in the CRM calendar</label><div><label class="lbl">Shared mailboxes to include (optional)</label><input class="in" name="shared" placeholder="hello@daitpartners.com"></div><div class="note info">Only messages from known contacts or company domains are linked to records automatically. Everything else appears under Email → Unlinked for you to link or turn into a lead.</div><div class="actions"><button class="btn" data-back>Back</button><button class="btn primary" data-finish>Connect mailbox</button></div>';
      const q = (s) => box.querySelector(s);
      box.querySelectorAll('[data-prov]').forEach((b) => b.addEventListener('click', () => { prov = b.dataset.prov; step = 1; render(bg); }));
      if (q('[data-back]')) q('[data-back]').addEventListener('click', () => { step = step === 1 && provider ? 0 : step - 1; if (step < 0) step = 0; render(bg); });
      if (q('[data-next]')) q('[data-next]').addEventListener('click', () => { step = step === 1 && prov !== 'microsoft' ? 3 : step + 1; render(bg); });
      if (q('[data-finish]')) q('[data-finish]').addEventListener('click', () => { const d = form(box); const a = Store.connectMailbox({ userId: me.id, provider: prov, syncMail: !!d.syncMail, syncCalendar: !!d.syncCalendar, sharedMailboxes: (d.shared || '').split(',').map((s) => s.trim()).filter(Boolean) }); bg.remove(); toast(PROV[prov][0] + ' connected · ' + a.address + ' · syncing last 90 days'); setTimeout(() => { Store.syncMailbox(a.id); toast('Initial sync complete · new reply linked to LD-2041'); }, 1800); });
    };
    modal('<div></div>', (bg) => render(bg));
  };
})();

</script>
<script>
/* Projects: many per client, each born from its own lead. Create/edit modal, list page, and the shared
   Client → Lead → Project email composer with primary stakeholders pre-filled. */
(function () {
  const { esc, dash, fmtDate, rel, badge, userLabel, opts, I, modal, toast, form, tile } = UI;
  const db = () => Store.db;
  const PSTATUS = ['Active', 'On hold', 'Completed', 'Cancelled'];
  const money = (p) => (p.value ? Store.fmtMoney(p.value, p.currency).replace(/\.00$/, '') : '—');
  const stakeholderNames = (p) => (p.stakeholders || []).map((id) => Store.contactName(id)).filter(Boolean).join(', ') || '—';

  /* ---- create / edit ---- */
  V.projectModal = function (preset, existing) {
    const me = Store.currentUser(); const x = existing || {}; const companyId = x.companyId || preset.companyId || '';
    const render = (bg, cid) => {
      const c = Store.company(cid); const leads = db().leads.filter((l) => l.companyId === cid); const contacts = db().contacts.filter((k) => k.companyId === cid);
      const sel = x.stakeholders || (preset.leadId ? Array.from(new Set([(Store.lead(preset.leadId) || {}).contactId].filter(Boolean).concat(Store.primaryStakeholders(cid)))) : Store.primaryStakeholders(cid));
      bg.querySelector('.modal').innerHTML = '<h2>' + (existing ? 'Edit project' : 'Create project') + '</h2><div class="grid2"><div><label class="lbl">Client <span class="req">*</span></label><select class="in" name="companyId" data-search' + (existing ? ' disabled' : '') + '>' + opts(db().companies.filter((k) => k.isClient || k.id === cid).map((k) => ({ value: k.id, label: (k.legalName || k.name) + (k.isClient ? ' · client' : ' · not yet a client') })), cid, '— choose client —') + '</select></div><div><label class="lbl">From lead</label><select class="in" name="leadId">' + opts(leads.map((l) => ({ value: l.id, label: l.id + ' · ' + (Store.contactName(l.contactId) || l.source) + ' · ' + l.status })), x.leadId || preset.leadId || '', '— none —') + '</select></div><div class="span2"><label class="lbl">Project name <span class="req">*</span></label><input class="in" name="name" value="' + esc(x.name || preset.name || (c ? c.name + ' · ' : '')) + '" placeholder="e.g. Warehouse automation advisory"></div><div><label class="lbl">Status</label><select class="in" name="status">' + opts(PSTATUS, x.status || 'Active') + '</select></div><div><label class="lbl">Start date</label><input class="in" type="date" name="startDate" value="' + (x.startDate || Store.today()) + '"></div><div><label class="lbl">Value</label><input class="in" type="number" name="value" value="' + (x.value || preset.value || '') + '"></div><div><label class="lbl">Currency</label><select class="in" name="currency">' + opts(db().config.currencies, x.currency || preset.currency || 'GBP') + '</select></div><div><label class="lbl">Project manager</label><select class="in" name="managerId">' + opts(db().users.map((u) => ({ value: u.id, label: u.name })), x.managerId || me.id) + '</select></div><div><label class="lbl">Linked quotation</label><select class="in" name="quoteId">' + opts(db().quotes.filter((q) => q.companyId === cid).map((q) => ({ value: q.id, label: q.id + ' · ' + q.status })), x.quoteId || preset.quoteId || '', '— none —') + '</select></div><div class="span2"><label class="lbl">Primary stakeholders <span style="font-weight:400;color:var(--muted)">(copied on every project email)</span></label><div style="display:flex;flex-direction:column;gap:6px">' + (contacts.map((k) => '<label class="sw"><input type="checkbox" name="sh_' + k.id + '"' + (sel.includes(k.id) ? ' checked' : '') + '> ' + esc(k.firstName + ' ' + k.lastName) + ' <span style="color:var(--muted)">· ' + esc(k.designation || k.type) + ' · ' + esc(k.email || 'no email') + '</span></label>').join('') || '<span style="font-size:12.5px;color:var(--muted)">No contacts at this client yet. Add contacts on the company profile.</span>') + '</div></div><div class="span2"><label class="lbl">Description</label><textarea class="in" name="description" rows="3">' + esc(x.description || '') + '</textarea></div></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>' + (existing ? 'Save' : 'Create project') + '</button></div>';
      UI.enhanceSelects(bg);
      bg.querySelector('[name=companyId]').addEventListener('change', (e) => render(bg, e.target.value));
      bg.querySelector('[data-go]').addEventListener('click', () => { const d = form(bg); if (!cid) { toast('Choose a client first', 'warn'); return; } if (!d.name.trim()) { toast('Project name is required', 'warn'); return; } const st = contacts.filter((k) => d['sh_' + k.id]).map((k) => k.id); const data = { companyId: cid, leadId: d.leadId || null, name: d.name.trim(), status: d.status, startDate: d.startDate, value: d.value ? Number(d.value) : null, currency: d.currency, managerId: d.managerId, quoteId: d.quoteId || null, stakeholders: st, description: d.description }; if (existing) { Store.updateProject(existing.id, data); toast('Project updated'); } else { const pr = Store.createProject(data); if (data.quoteId) { const q = db().quotes.find((k) => k.id === data.quoteId); if (q) { q.projectId = pr.id; Store.save(); } } toast(pr.id + ' created · ' + st.length + ' stakeholders'); } bg.remove(); });
    };
    modal('<div></div>', (bg) => render(bg, companyId));
  };

  /* ---- shared card (lead page + company profile) ---- */
  V.projectsCard = function (companyId, leadId) {
    const c = Store.company(companyId); const list = Store.projectsFor(companyId);
    if (!c) return '';
    return '<section class="card" style="gap:10px"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2>Projects <span class="n" style="font-weight:500;color:var(--muted)">' + list.length + '</span></h2>' + (c.isClient ? '<button class="btn xs primary" data-act="newproject">+ Create project</button>' : '') + '</div>' + (c.isClient ? '' : '<div style="font-size:12.5px;color:var(--muted)">Projects unlock when a lead at this company is marked <strong>Won</strong> or a quotation is accepted.</div>') + (list.map((p) => '<a class="link" href="#/projects?company=' + companyId + '" style="' + (leadId && p.leadId === leadId ? 'border-color:#822CDB;background:var(--tint)' : '') + '"><span style="min-width:0"><strong>' + esc(p.name) + '</strong><span style="display:block;color:var(--muted);font-size:12px">' + p.id + (p.leadId ? ' · from ' + p.leadId : '') + ' · ' + money(p) + ' · ' + esc(Store.userName(p.managerId)) + '</span></span>' + badge(p.status, p.status === 'Active' ? 'b-ok' : p.status === 'Completed' ? 'b-grey' : 'b-warn') + '</a>').join('') || (c.isClient ? '<div style="font-size:12.5px;color:var(--muted)">No projects yet. Create the first one for this engagement.</div>' : '')) + '</section>';
  };

  /* ---- list page ---- */
  V.projects = function (q) {
    q = q || {}; let list = db().projects.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    if (q.company) list = list.filter((p) => p.companyId === q.company);
    if (q.status) list = list.filter((p) => p.status === q.status);
    const clients = db().companies.filter((c) => c.isClient);
    const html = topbar('Projects', 'Engagements won from leads. One client can have many projects, each from its own lead.', '<a class="btn" href="#/email?compose=1' + (q.company ? '&company=' + q.company : '') + '">Email a project</a><button class="btn primary" data-act="newproject">' + I.plus + 'Create project</button>') +
      '<div class="page"><div class="tiles">' + tile('Active projects', db().projects.filter((p) => p.status === 'Active').length, clients.length + ' clients') + tile('Total value', (function () { const o = {}; db().projects.forEach((p) => { if (p.value) o[p.currency] = (o[p.currency] || 0) + p.value; }); return Object.keys(o).map((k) => Store.fmtMoney(o[k], k).replace(/\.00$/, '')).join(' · ') || '—'; })(), 'across all projects') + tile('Completed', db().projects.filter((p) => p.status === 'Completed').length, 'this year') + tile('On hold', db().projects.filter((p) => p.status === 'On hold').length, '') + '</div>' +
      '<div class="card flush"><div class="filters"><select class="chip" name="company" data-search>' + opts(clients.map((c) => ({ value: c.id, label: c.legalName || c.name })), q.company || '', 'Client: all') + '</select><select class="chip" name="status">' + opts(PSTATUS, q.status || '', 'Status: any') + '</select>' + (q.company || q.status ? '<a class="btn sm" href="#/projects">✕ Clear</a>' : '') + '<div class="grow"></div><span style="font-size:12.5px;color:var(--muted)">' + list.length + ' projects</span></div><div class="tbl"><table><thead><tr><th>Project</th><th>Client</th><th>From lead</th><th>Status</th><th>Start</th><th>Value</th><th>Project manager</th><th>Primary stakeholders</th><th>Quotation</th><th></th></tr></thead><tbody>' + (list.map((p) => { const c = Store.company(p.companyId); return '<tr><td><strong>' + esc(p.name) + '</strong><span style="display:block;font-size:11.5px;color:var(--muted)">' + p.id + '</span></td><td><a href="#/companies/' + p.companyId + '/projects" style="color:var(--text);font-weight:600">' + esc(c ? c.legalName || c.name : '—') + '</a></td><td>' + (p.leadId ? '<a href="#/leads/' + p.leadId + '">' + p.leadId + '</a>' : '<span class="dim">—</span>') + '</td><td>' + badge(p.status, p.status === 'Active' ? 'b-ok' : p.status === 'Completed' ? 'b-grey' : 'b-warn') + '</td><td>' + fmtDate(p.startDate) + '</td><td>' + money(p) + '</td><td>' + userLabel(p.managerId) + '</td><td class="wrap" style="max-width:260px">' + esc(stakeholderNames(p)) + '</td><td>' + (p.quoteId ? '<a href="#/quotes/' + p.quoteId + '">' + p.quoteId + '</a>' : '<span class="dim">—</span>') + '</td><td style="white-space:nowrap"><a class="btn xs" href="#/email?compose=1&company=' + p.companyId + '&lead=' + (p.leadId || '') + '&project=' + p.id + '">Email</a> <button class="btn xs" data-edit="' + p.id + '">Edit</button></td></tr>'; }).join('') || '<tr><td colspan="10" class="empty">No projects yet. Mark a lead as Won or accept a quotation, then create the project.</td></tr>') + '</tbody></table></div></div></div>';
    return { html, mount(el) {
      el.querySelector('[data-act=newproject]').addEventListener('click', () => V.projectModal({ companyId: q.company || '' }));
      el.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => { const p = db().projects.find((x) => x.id === b.dataset.edit); V.projectModal({}, p); }));
      el.querySelector('[name=company]').addEventListener('change', (e) => { location.hash = '#/projects?' + qs({ company: e.target.value, status: q.status }); });
      el.querySelector('[name=status]').addEventListener('change', (e) => { location.hash = '#/projects?' + qs({ company: q.company, status: e.target.value }); });
    } };
  };

  /* ---- Compose: Client → Lead → Project, stakeholders pre-filled ---- */
  V.compose = function (p) {
    p = p || {}; const me = Store.currentUser();
    let companyId = p.companyId || ''; let leadId = p.leadId || ''; let projectId = p.projectId || '';
    if (p.contactId && !leadId) { const ct = Store.contact(p.contactId); if (ct) { companyId = ct.companyId; const l = db().leads.find((x) => x.contactId === ct.id); if (l) leadId = l.id; } }
    if (leadId && !companyId) companyId = (Store.lead(leadId) || {}).companyId || '';
    if (projectId && !companyId) companyId = (db().projects.find((x) => x.id === projectId) || {}).companyId || '';
    let subject = p.subject || ''; let body = p.body || ('Hi,\n\n\n\nBest regards,\n' + me.name); let toOverride = p.to || '';
    const render = (bg) => {
      const box = bg.querySelector('.modal');
      const c = companyId ? Store.company(companyId) : null; const leads = db().leads.filter((l) => l.companyId === companyId && !l.archived); const projects = Store.projectsFor(companyId);
      const l = leadId ? Store.lead(leadId) : null; const pr = projectId ? db().projects.find((x) => x.id === projectId) : null;
      const contacts = db().contacts.filter((k) => k.companyId === companyId && k.email);
      const primaryIds = pr ? pr.stakeholders : Store.primaryStakeholders(companyId);
      const toContact = l && l.contactId ? Store.contact(l.contactId) : contacts.find((k) => k.primary) || contacts[0];
      const to = toOverride || (toContact && toContact.email) || '';
      const cc = contacts.filter((k) => primaryIds.includes(k.id) && k.email !== to);
      box.innerHTML = '<h2>Compose email</h2><div class="grid3"><div><label class="lbl">Client</label><select class="in" name="cCompany" aria-label="Client" data-search>' + opts(db().companies.slice().sort((a, b) => a.name.localeCompare(b.name)).map((k) => ({ value: k.id, label: (k.legalName || k.name) + (k.isClient ? ' · client' : '') })), companyId, '— choose client / company —') + '</select></div><div><label class="lbl">Lead</label><select class="in" name="cLead" aria-label="Lead"' + (companyId ? '' : ' disabled') + '>' + opts(leads.map((x) => ({ value: x.id, label: x.id + ' · ' + (Store.contactName(x.contactId) || x.source) + ' · ' + x.status })), leadId, companyId ? '— no lead —' : 'choose client first') + '</select></div><div><label class="lbl">Project</label><select class="in" name="cProject" aria-label="Project"' + (companyId ? '' : ' disabled') + '>' + opts(projects.map((x) => ({ value: x.id, label: x.id + ' · ' + x.name })), projectId, companyId ? (projects.length ? '— no project —' : 'no projects yet') : 'choose client first') + '</select></div></div>' +
        '<div class="grid2"><div><label class="lbl">To</label><input class="in" name="to" value="' + esc(to) + '" placeholder="' + (companyId ? 'no email on the lead contact' : 'choose a client or type an address') + '"></div><div><label class="lbl">Cc <span style="font-weight:400;color:var(--muted)">(stakeholders)</span></label><input class="in" name="cc" value="' + esc(cc.map((k) => k.email).join(', ')) + '"></div></div>' +
        (contacts.length ? '<div><div class="lbl">Keep in the loop</div><div style="display:flex;gap:6px 14px;flex-wrap:wrap">' + contacts.map((k) => '<label class="sw" style="font-size:12.5px"><input type="checkbox" data-sh="' + esc(k.email) + '"' + (k.email === to || cc.includes(k) ? ' checked' : '') + (k.email === to ? ' disabled' : '') + '> ' + esc(k.firstName + ' ' + k.lastName) + ' <span style="color:var(--muted)">· ' + esc(k.designation || k.type) + (primaryIds.includes(k.id) ? ' · primary' : '') + '</span></label>').join('') + '</div></div>' : '') +
        '<div class="grid2"><div><label class="lbl">Template</label><select class="in" name="ctpl"><option value="">— blank —</option>' + Store.templatesFor(me.lang || 'en').map((x) => '<option value="' + x.id + '">' + esc(x.name) + (x.source === 'oft' ? ' · .oft' : '') + '</option>').join('') + '</select></div><div><label class="lbl">Context saved on</label><div style="font-size:12.5px;color:var(--body);padding-top:9px">' + (c ? esc(c.name) : '<span class="dim">—</span>') + (l ? ' · ' + l.id : '') + (pr ? ' · ' + esc(pr.name) : '') + '</div></div><div class="span2"><label class="lbl">Subject</label><input class="in" name="subject" value="' + esc(subject) + '"></div><div class="span2"><label class="lbl">Message</label><textarea class="in" name="body" rows="8">' + esc(body) + '</textarea></div></div><div class="actions"><button class="btn" data-close>Discard</button><button class="btn primary" data-go>Send</button></div>';
      UI.enhanceSelects(bg);
      const keep = () => { subject = box.querySelector('[name=subject]').value; body = box.querySelector('[name=body]').value; };
      box.querySelector('[name=cCompany]').addEventListener('change', (e) => { keep(); companyId = e.target.value; leadId = ''; projectId = ''; toOverride = ''; render(bg); });
      box.querySelector('[name=cLead]').addEventListener('change', (e) => { keep(); leadId = e.target.value; toOverride = ''; render(bg); });
      box.querySelector('[name=cProject]').addEventListener('change', (e) => { keep(); projectId = e.target.value; const prj = db().projects.find((x) => x.id === projectId); if (prj && prj.leadId && !leadId) leadId = prj.leadId; render(bg); });
      box.querySelectorAll('[data-sh]').forEach((cb) => cb.addEventListener('change', () => { const on = [...box.querySelectorAll('[data-sh]:checked:not(:disabled)')].map((x) => x.dataset.sh); box.querySelector('[name=cc]').value = on.join(', '); }));
      box.querySelector('[name=ctpl]').addEventListener('change', (e) => { const T = (db().templates || []).find((x) => x.id === e.target.value); if (!T) return; const ctx = { first_name: toContact ? toContact.firstName : '', company: c ? c.name : '', me: me.name, lead_id: leadId, quote_no: '' }; box.querySelector('[name=subject]').value = Store.fillTemplate(T.subject, ctx); box.querySelector('[name=body]').value = Store.fillTemplate(T.body, ctx); });
      box.querySelector('[data-go]').addEventListener('click', () => { const d = form(box); if (!d.to || !d.subject) { toast('Recipient and subject are required', 'warn'); return; } Store.sendEmail({ to: d.to, cc: d.cc, subject: d.subject, body: d.body, leadId: leadId || null, contactId: l ? l.contactId : (toContact ? toContact.id : null), companyId: companyId || null, projectId: projectId || null }); bg.remove(); toast(Store.accountFor(me.id) ? 'Email sent' + (d.cc ? ' · cc ' + d.cc.split(',').length + ' stakeholder(s)' : '') + (leadId ? ' · logged on ' + leadId : '') : 'Email logged' + (leadId ? ' on ' + leadId : '') + ' · not sent: connect your mailbox in Settings', Store.accountFor(me.id) ? 'ok' : 'warn'); });
    };
    modal('<div></div>', (bg) => render(bg));
  };
})();

</script>
