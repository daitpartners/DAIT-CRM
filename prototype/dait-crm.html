<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAIT Partners CRM — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* DAIT Partners CRM prototype — theme tokens and components
   Colours from the approved brand theme; Montserrat per the design spec. */
:root{
  --ink:#1F0249; --purple:#6811CF; --purple-2:#812BE1; --orange:#BA5425; --orange-2:#AB4C21; --peach:#F09044; --bg:#F5F1FC;
  --text:#1F1533; --muted:#6A5E86; --body:#4A3F66; --faint:#7B709A;
  --line:#E3DCF2; --line-2:#EDE8F6; --field:#D2C7E8; --surface:#FFFFFF; --tint:#EFE6FD; --tint-2:#E4D5FB;
  --nav-text:#CFC2EC; --nav-hover:#2E0F66; --nav-on:#3A1A78; --nav-sub:#9D8CC9; --nav-muted:#AE9FD6;
  --grad:linear-gradient(90deg,#BA5326,#822CDB);
  --ok-bg:#DCF5E6; --ok-fg:#0F5C2E; --warn-bg:#FFF1E0; --warn-fg:#8A4B00; --bad-bg:#FDE8E8; --bad-fg:#A32020;
  --info-bg:#FBE4D4; --info-fg:#8A3E12; --grey-bg:#EDE9F4; --grey-fg:#514768;
  --radius:10px; --font:Montserrat,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased}
a{color:var(--purple);text-decoration:none}a:hover{color:#4B0A9A}
h1,h2,h3{margin:0;font-weight:800}
h1{font-size:20px}h2{font-size:14px;font-weight:700}h3{font-size:13px;font-weight:700}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Shell */
.shell{min-height:100vh;display:flex;flex-wrap:wrap}
.sidebar{width:232px;flex:0 0 232px;background:var(--ink);display:flex;flex-direction:column;padding:18px 12px 20px;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;color:#fff}
.brand img{width:34px;height:40px;object-fit:contain}
.brand b{display:block;font-size:14px}.brand small{font-size:11px;color:var(--nav-muted)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--nav-text);font-size:13.5px;font-weight:500}
.nav:hover{background:var(--nav-hover);color:#fff}.nav.on{background:var(--nav-on);color:#fff}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:#5A2BB0;color:#fff;border-radius:999px;padding:2px 8px}
.nav .cnt.hot{background:var(--peach);color:var(--ink)}
.navsec{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-sub);padding:14px 10px 6px}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;margin-top:6px;border-top:1px solid var(--nav-on);color:#fff}
.me .av{background:var(--peach);color:var(--ink)}
.me small{display:block;font-size:11px;color:var(--nav-muted)}
.me select{margin-top:4px;width:100%;background:var(--nav-on);color:#fff;border:0;border-radius:6px;padding:4px 6px;font-size:11.5px}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.topbar .crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.grow{flex-grow:1}
.page{padding:20px 28px 28px;display:flex;flex-direction:column;gap:16px}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.page.cols{flex-direction:row}
/* verify buttons only on hover */
.kv dd .btn.xs{opacity:0;transition:opacity .15s}.kv dd:hover .btn.xs,.kv dd .btn.xs:focus{opacity:1}
/* lead page: status pipeline, control strip, composer */
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.stage{flex:1 1 92px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
.stage .bar{height:7px;border-radius:4px;background:var(--line)}
.stage.done .bar{background:#822CDB}.stage.on .bar{background:var(--grad)}
.stage .t{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:500;white-space:nowrap}
.stage.on .t{color:var(--purple);font-weight:700}.stage.done .t{color:var(--text)}
.stage:hover .bar{box-shadow:0 0 0 3px var(--tint-2)}
.stage.closed .bar{background:var(--bad-fg)}.stage.closed .t{color:var(--bad-fg);font-weight:700}
.ctrl{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.ctrl>div{display:flex;flex-direction:column;gap:6px;min-width:150px}
.ctrl .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ctrl .in{height:34px}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--field);background:#fff;font-size:11px;font-weight:600;color:var(--body)}
.quick button:hover{background:var(--tint);border-color:#822CDB;color:#4B0A9A}
.ctab{display:inline-flex;align-items:center;gap:6px}.ctab svg{width:15px;height:15px}
.composer .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.composer .body[hidden]{display:none}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.crow .k{color:var(--muted);width:64px;flex:0 0 auto;font-size:12px}
.crow .v{min-width:0;overflow-wrap:anywhere;flex-grow:1}
.crow .act{margin-left:auto}
.rnote{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#FFFDF9}
.rnote strong{display:block}.rnote a{display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.tl .ev .b.research{background:#FFFDF9;border:1px dashed #F6D0B2;border-radius:8px;padding:8px 10px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.hdr-actions .btn svg{width:15px;height:15px}
.closed-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;background:var(--bad-bg);color:var(--bad-fg);font-size:13px}
.col-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-side{flex:1 1 300px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:16px}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card .head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .foot{padding:12px 18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--text)}
.tile .l{font-size:12px;color:var(--muted);font-weight:500}.tile .v{font-size:24px;font-weight:800;margin-top:4px}.tile .m{font-size:12px;color:var(--muted);margin-top:2px}
.tile .m.bad{color:var(--bad-fg)}.tile .m.ok{color:#176B3A}.tile .m.warn{color:var(--warn-fg)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.b-purple{background:var(--tint);color:#4B0A9A}.b-purple2{background:var(--tint-2);color:#4B0A9A}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)}.b-warn{background:var(--warn-bg);color:var(--warn-fg)}.b-bad{background:var(--bad-bg);color:var(--bad-fg)}
.b-info{background:var(--info-bg);color:var(--info-fg)}.b-grey{background:var(--grey-bg);color:var(--grey-fg)}
.tag-ai{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;background:var(--warn-bg);color:var(--warn-fg);border:1px dashed var(--peach);vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag-ok{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;background:var(--ok-bg);color:var(--ok-fg);vertical-align:middle;margin-left:6px}
.prio{display:inline-flex;align-items:center;gap:6px}.prio::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.prio.High::before{background:#C62828}.prio.Medium::before{background:#B26A00}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--field);background:var(--surface);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.btn:hover{background:#F9F7FD;color:var(--text)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff}.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}.btn.xs{height:26px;padding:0 8px;font-size:12px}
.btn.danger{color:var(--bad-fg);border-color:#F2B8B8}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;color:var(--text)}
select.in,select.chip{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236A5E86' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px;cursor:pointer}
select.in:disabled,select.chip:disabled{opacity:.6;cursor:default}
.filters{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
.tabs{display:flex;align-items:center;gap:22px;padding:0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;overflow-x:auto}
.tab{padding:11px 2px;font-size:13.5px;font-weight:500;color:var(--muted);border:0;border-bottom:2px solid transparent;background:none;white-space:nowrap}
.tab.on{color:var(--purple);border-bottom-color:var(--purple);font-weight:600}
.tab .n{color:var(--faint);font-weight:500}.tab .n.bad{color:var(--bad-fg);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);width:280px;max-width:100%}
.search input{border:0;outline:0;background:transparent;flex-grow:1;font-size:13px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#F9F7FD}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#F6F2FD}tr.sel td{background:var(--tint)}
td.wrap{white-space:normal}td .dim{color:var(--faint)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.lbl{font-size:12.5px;font-weight:600;color:var(--body);margin-bottom:6px;display:block}
.req{color:var(--bad-fg);margin-left:2px}
.in{width:100%;height:38px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);font-size:13.5px;color:var(--text)}
.in:focus{outline:2px solid var(--purple);outline-offset:1px;border-color:var(--purple)}
textarea.in{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.in.err{border-color:var(--bad-fg)}
.err-msg{font-size:12px;color:var(--bad-fg);margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.kv{display:grid;grid-template-columns:140px 1fr;gap:9px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.kv dd.null{color:var(--faint);font-weight:400}
.pill{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--grey-bg);color:var(--body);font-size:12px;font-weight:500;margin:0 6px 6px 0}
.note{padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5}
.note.warn{border:1px solid #F0C98A;background:#FFF8EC;color:var(--body)}
.note.ok{border:1px solid #C9E8D3;background:#F1FBF4;color:var(--ok-fg)}
.note.info{background:#F9F7FD;border:1px solid var(--line);color:var(--muted)}
.note.ai{border:1px dashed var(--peach);background:#FFFBF4;color:var(--body)}
.legend{display:flex;gap:14px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--body);flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:var(--tint);color:#4B0A9A}
.logo{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;margin-right:10px;vertical-align:middle;background:var(--tint);color:#4B0A9A}
.logo.lg{width:56px;height:56px;border-radius:12px;font-size:18px;font-weight:800;margin:0}
.tl{display:flex;gap:14px}.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--tint)}
.tl .dot svg{width:15px;height:15px}
.tl .line{flex-grow:1;width:2px;background:var(--line);margin:4px auto 0}
.tl .ev{padding-bottom:18px;min-width:0;font-size:13px}.tl .ev .m{color:var(--muted)}.tl .ev .b{color:var(--body);margin-top:4px;line-height:1.5}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.task.over{border-color:#F2B8B8;background:#FFF7F7}.task.done{opacity:.55}
.task strong{display:block}.task .m{color:var(--muted);font-size:12px;margin-top:2px}
.task input{margin-top:3px;accent-color:var(--purple)}
.radio-card{display:flex;gap:12px;padding:14px 16px;border:1px solid var(--field);border-radius:10px;background:var(--surface);cursor:pointer}
.radio-card.on{border:2px solid var(--purple);background:var(--tint)}
.radio-card input{margin-top:3px;accent-color:var(--purple)}
.radio-card small{display:block;font-size:12.5px;color:var(--body);margin-top:2px}
.score{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.score div{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.bar{height:8px;background:var(--grey-bg);border-radius:4px;margin-top:4px}.bar div{height:8px;border-radius:4px;background:#822CDB}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.sw input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--field);position:relative;margin:0;flex:0 0 auto}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:#822CDB}.sw input:checked::after{left:16px}
/* searchable dropdown (combobox) */
.combo{position:relative;min-width:0}
.combo>input{padding-right:34px;width:100%;text-overflow:ellipsis}
.combo>input.chip{width:190px}
.combo .caret{position:absolute;right:12px;top:0;bottom:0;margin:auto 0;width:16px;height:16px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;pointer-events:auto}
.combo .caret svg{width:16px;height:16px;display:block}
.combo-list{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;max-width:420px;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--field);border-radius:8px;box-shadow:0 10px 30px rgba(31,2,73,.14);z-index:40;padding:4px;margin:0;list-style:none}
.combo-list[hidden]{display:none}
.combo-list li{padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-list li.on,.combo-list li:hover{background:var(--tint);color:#4B0A9A}
.combo-list li mark{background:#FFE7C9;color:inherit;border-radius:2px;padding:0 1px}
.combo-list li.none{color:var(--muted);cursor:default}
.combo-list .hint{padding:4px 10px 6px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line-2);margin-bottom:4px}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(31,2,73,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:560px;max-width:100%;max-height:90vh;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(31,2,73,.25)}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(31,2,73,.3);max-width:360px}
.toast.ok{border-left:4px solid #5BD48A}.toast.warn{border-left:4px solid var(--peach)}
/* email */
.mail{display:flex;flex-wrap:wrap;align-items:stretch;flex-grow:1}
.folders{flex:0 0 190px;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.fold{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--body);border:0;background:none;text-align:left}
.fold.on{background:var(--tint);color:#4B0A9A;font-weight:600}
.fold .cnt{margin-left:auto;font-size:11px;background:#822CDB;color:#fff;border-radius:999px;padding:1px 7px}
.msglist{flex:1 1 300px;max-width:400px;min-width:0;border-right:1px solid var(--line);background:var(--surface)}
.msg{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;color:var(--text);width:100%;border:0;background:none;text-align:left}
.msg.on{background:var(--tint)}.msg.unread .who{font-weight:800}
.msg .who{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.msg .sub{font-size:12.5px;margin-top:2px}.msg .pre{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .t{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.reader{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.reader .body{padding:20px 24px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.mailside{flex:0 1 250px;min-width:0;padding:18px 16px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--text)}
/* calendar */
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.cal .dh{padding:10px 4px;color:var(--muted);font-size:12px;text-align:center;border-bottom:1px solid var(--line);background:#F9F7FD}
.cal .dh b{display:block;font-size:15px;color:var(--text)}.cal .dh.today{background:var(--tint)}.cal .dh.today b{color:#4B0A9A}
.cal .hours{position:relative;font-size:11px;color:var(--muted);text-align:right;padding-right:8px}
.cal .hours span{position:absolute;right:8px}

.nrow:hover{background:#FBF9FF}.nrow.unread{background:#FAF6FF}
.ni{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}.ni svg{width:18px;height:18px}

.ndot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--purple);margin-top:6px}

<script>
/* Mock data layer. Stands in for the Node.js API + MySQL/Postgres.
   Persists to localStorage so the public form (contact-form.html) and the CRM share one "database".
   Every rule the spec calls out lives here, not in the views:
   duplicate detection, immutable enquiries, lead allocation, follow-up → task, transfer history + notifications,
   AI enrichment that never overwrites verified fields, quotation revisions and conversion. */
window.Store = (function () {
  const KEY = 'dait-crm-proto-v1';
  let db = null;
  const listeners = [];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); return; } } catch (e) { /* storage blocked */ }
    db = clone(window.SEED);
  }
  /* Data saved by an older build may be missing collections or config lists added since (projects, templates,
     mailbox accounts…). Fill every missing key from the seed so old browsers never crash on undefined. */
  function migrate() {
    if (!db) return;
    const seed = window.SEED;
    Object.keys(seed).forEach((k) => { if (k !== 'TODAY' && db[k] === undefined) db[k] = clone(seed[k]); });
    ['config', 'counters'].forEach((k) => { Object.keys(seed[k]).forEach((s) => { if (db[k][s] === undefined) db[k][s] = clone(seed[k][s]); }); });
    if (db.counters.project === undefined) db.counters.project = db.projects.reduce((m, p) => Math.max(m, Number(String(p.id).replace(/\D/g, '')) || 0), 0) + 1;
    if (typeof db.rr !== 'object' || db.rr === null) db.rr = {};
    if (!Array.isArray(db.campaigns)) db.campaigns = [];
    // Leads-2 person profile fields (added after the first builds)
    const seedCt = {}; seed.contacts.forEach((c) => { seedCt[c.id] = c; });
    db.contacts.forEach((c) => { const s = seedCt[c.id] || {}; ['headline', 'location', 'about', 'photo'].forEach((k) => { if (c[k] === undefined) c[k] = s[k] === undefined ? null : clone(s[k]); }); ['experience', 'education', 'skills', 'languages'].forEach((k) => { if (!Array.isArray(c[k])) c[k] = clone(s[k] || []); }); });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* ignore */ } listeners.forEach((fn) => fn()); }
  function reset() { db = clone(window.SEED); migrate(); save(); }
  function onChange(fn) { listeners.push(fn); }
  load(); migrate();

  /* ---------- helpers ---------- */
  const now = () => (db.clock || window.SEED.TODAY + 'T' + new Date().toTimeString().slice(0, 8));
  const today = () => window.SEED.TODAY;
  function nextId(kind) {
    const c = db.counters; const n = c[kind]++;
    return { lead: 'LD-' + n, company: 'CO-' + String(n).padStart(4, '0'), contact: 'CT-' + n, enquiry: 'ENQ-' + String(n).padStart(4, '0'), quote: 'Q-2026-' + String(n).padStart(3, '0'), task: 'T-' + n, activity: 'A-' + n, note: 'X-' + n, project: 'PRJ-' + n }[kind];
  }
  /* Unique id for rows without a business counter (sources, assignments, runs…). Date.now() alone repeats
     when two rows are created in the same millisecond. */
  let uidSeq = 0;
  const uid = (prefix) => prefix + '-' + Date.now().toString(36) + (uidSeq++).toString(36) + Math.random().toString(36).slice(2, 6);
  /* Only web, mail and phone links may become an href; anything else (javascript:, data:…) is dropped. */
  const safeUrl = (u) => { if (!u) return null; const s = String(u).trim(); if (/^(https?:|mailto:|tel:)/i.test(s)) return s; if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return null; return /^[\w-]+(\.[\w-]+)+/.test(s) ? 'https://' + s : null; };
  const CLOSED_STATUSES = ['Won', 'Lost', 'Not Relevant'];
  const by = (list, id) => list.find((x) => x.id === id) || null;
  const user = (id) => by(db.users, id);
  const userName = (id) => (id === 'system' ? 'System' : (user(id) || {}).name || 'Unassigned');
  const company = (id) => by(db.companies, id);
  const contact = (id) => by(db.contacts, id);
  const contactName = (id) => { const c = contact(id); return c ? c.firstName + ' ' + c.lastName : null; };
  const lead = (id) => by(db.leads, id);
  const domainOf = (s) => { if (!s) return null; let d = String(s).trim().toLowerCase(); if (d.includes('@')) d = d.split('@')[1]; d = d.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0]; return d || null; };
  const FREE_MAIL = ['gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'icloud.com', 'free-prizes.biz'];
  const norm = (s) => (s || '').toLowerCase().replace(/\b(pvt|private|ltd|limited|llc|inc|gmbh|plc|spa|sl|pty|co|corp|corporation|company|group)\b\.?/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  const normPhone = (p) => (p || '').replace(/[^0-9]/g, '').slice(-10);
  const isOverdue = (t) => !t.done && t.due && t.due < today();
  const isToday = (t) => !t.done && t.due === today();

  /* ---------- duplicate detection ---------- */
  function matchCompany({ name, website, email }) {
    const d = domainOf(website) || (email && !FREE_MAIL.includes(domainOf(email)) ? domainOf(email) : null);
    if (d) { const hit = db.companies.find((c) => c.domain === d); if (hit) return { match: hit, how: 'exact website domain', confidence: 'High', candidates: [hit] }; }
    if (name) {
      const exactLegal = db.companies.find((c) => c.legalName && c.legalName.toLowerCase() === name.toLowerCase());
      if (exactLegal) return { match: exactLegal, how: 'exact legal company name', confidence: 'High', candidates: [exactLegal] };
      const n = norm(name);
      const cands = db.companies.filter((c) => norm(c.name) === n || norm(c.legalName) === n);
      if (cands.length === 1) return { match: null, how: 'normalised name (country unconfirmed)', confidence: 'Medium', candidates: cands };
      if (cands.length > 1) return { match: null, how: 'several normalised-name matches', confidence: 'Low', candidates: cands };
    }
    return { match: null, how: 'no match', confidence: null, candidates: [] };
  }
  function matchCompanyWithCountry(args) {
    const r = matchCompany(args);
    if (!r.match && r.candidates.length === 1 && args.country && r.candidates[0].country === args.country) return { match: r.candidates[0], how: 'normalised name + country', confidence: 'Medium', candidates: r.candidates };
    return r;
  }
  function matchContact({ email, phone, firstName, lastName, companyId }) {
    if (email) { const hit = db.contacts.find((c) => c.email && c.email.toLowerCase() === email.toLowerCase()); if (hit) return { match: hit, how: 'exact email' }; }

  /* ---------- website enquiry workflow ---------- */
  function submitEnquiry(form) {
    const errors = {};
    if (!form.fullName || form.fullName.trim().length < 2) errors.fullName = 'Please enter your full name.';
    if (!form.email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email)) errors.email = 'Please enter a valid business email.';
    if (!form.companyName || form.companyName.trim().length < 2) errors.companyName = 'Please enter your company name.';
    if (!form.message || form.message.trim().length < 10) errors.message = 'Please describe your requirement (at least 10 characters).';
    if (form.website && !/^https?:\/\//i.test(form.website)) form.website = 'https://' + form.website;
    if (Object.keys(errors).length) return { ok: false, errors };
    // 1–2 validate + store immutable record
    const enq = { id: nextId('enquiry'), fullName: form.fullName.trim(), email: form.email.trim(), phone: form.phone ? form.phone.trim() : null, companyName: form.companyName.trim(), website: form.website || null, message: form.message.trim(), submittedAt: now(), sourcePage: 'daitpartners.com/contact', spamCheck: form.honeypot ? 'Failed · honeypot' : 'Passed', status: 'Received', leadId: null, contactId: null, companyId: null, trace: ['Validated and stored'] };

    // Object.freeze would not survive the JSON round-trip, so the real build must enforce this in the database.
    db.enquiries.unshift(enq);
    if (form.honeypot) { enq.status = 'Spam'; enq.trace.push('Honeypot field filled → blocked', 'No records created'); save(); return { ok: true, enquiry: enq, spam: true }; }
    // 3–6 company
    const cm = matchCompany({ name: enq.companyName, website: enq.website, email: enq.email });
    let comp;
    if (cm.match) { comp = cm.match; enq.trace.push('Company match on ' + cm.how + ' → existing ' + comp.id); }
    else if (cm.candidates.length) { enq.status = 'Needs review'; enq.reviewCandidates = cm.candidates.map((c) => c.name + ' (' + c.id + ')'); enq.trace.push('Possible company match (' + cm.how + ') with uncertain confidence', 'Held for manual review · no lead created yet'); save(); return { ok: true, enquiry: enq, review: true }; }
    else { comp = createCompany({ name: enq.companyName, website: enq.website, country: null }, 'system'); enq.trace.push('No company match → created ' + comp.id); }
    enq.companyId = comp.id;
    // 7 contact

    const ctm = matchContact({ email: enq.email, phone: enq.phone, firstName: first, lastName: last, companyId: comp.id });
    let ct;
    if (ctm.match) { ct = ctm.match; enq.trace.push('Contact match on ' + ctm.how + ' → existing ' + ct.id); }
    else { ct = createContact({ companyId: comp.id, firstName: first, lastName: last || '', email: enq.email, mobile: enq.phone, type: 'Other' }); enq.trace.push('No contact match → created ' + ct.id); }
    enq.contactId = ct.id;
    // 8–15 lead
    const l = createLead({ companyName: enq.companyName, companyId: comp.id, contactId: ct.id, website: enq.website, email: enq.email, phone: enq.phone, country: comp.country || 'Unknown', city: comp.city, source: 'Website Contact Form', sourceUrl: 'https://daitpartners.com/contact', status: 'New', notes: enq.message, enquiryId: enq.id, enrichment: 'Pending', followUp: addDays(today(), 2) });
    enq.leadId = l.id; enq.status = 'Enrichment pending';
    enq.trace.push('New lead ' + l.id + ' created · Lead · Website Contact Form · New', 'AI enrichment status = Pending', l.assignedTo ? 'Assigned to ' + userName(l.assignedTo) + ' and notified' : 'No allocation rule matched · unassigned', 'Follow-up task added to owner\'s list', 'Visitor confirmation sent');
    db.sources.push({ id: uid('SR'), companyId: comp.id, title: 'Website enquiry ' + enq.id, url: null, type: 'Contact form', at: now(), by: 'Visitor', fields: 'Company name, website, contact email, phone', confidence: 'Submitted by contact', snapshot: null });
    save(); return { ok: true, enquiry: enq, lead: l, company: comp, contact: ct };
  }

      input.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) show(); active = Math.min(shown.length - 1, active + 1); mark(); } else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); mark(); } else if (e.key === 'Enter') { if (open) { e.preventDefault(); choose(active); } } else if (e.key === 'Escape') { hide(); } else if (e.key === 'Tab') { hide(); } });

      el.querySelector('[data-send=meeting]').addEventListener('click', () => { const g = (n) => el.querySelector('[name=' + n + ']').value; const [h, m] = g('mtime').split(':').map(Number); const endM = h * 60 + m + Number(g('mlen')); const end = String(Math.floor(endM / 60)).padStart(2, '0') + ':' + String(endM % 60).padStart(2, '0'); const inv = g('minvite'); Store.createEvent({ title: g('mtitle'), type: 'meeting', date: g('mdate'), start: g('mtime'), end, leadId: id, companyId: l.companyId, contactId: l.contactId, attendees: [ct ? ct.firstName + ' ' + ct.lastName : l.companyName, me.name].concat(inv ? [Store.userName(inv)] : []).join(', '), attendeeIds: inv ? [inv] : [], where: g('mwhere'), note: 'Invite sent' }); Store.updateLead(id, { followUp: g('mdate') }); toast('Meeting scheduled · invite sent · follow-up set to ' + fmtDate(g('mdate'))); });
      el.querySelector('[data-send=research]').addEventListener('click', () => { const g = (n) => el.querySelector('[name=' + n + ']').value.trim(); if (!g('rtitle')) { toast('Give the research a title', 'warn'); return; } Store.saveResearch(id, g('rtitle'), g('rurl') || null, g('rbody')); toast('Research saved on ' + id + (l.companyId ? ' and listed under company sources' : '')); location.hash = '#/leads/' + id + '/research'; });
      // misc
      act('task', () => modal('<h2>New task</h2><div><label class="lbl">Title</label><input class="in" name="title" value="Follow up · ' + esc(l.companyName) + '"></div><div class="grid2"><div><label class="lbl">Due</label><input class="in" type="date" name="due" value="' + Store.addDays(t, 1) + '"></div><div><label class="lbl">Assigned to</label><select class="in" name="assignedTo">' + opts(db().users.map((u) => ({ value: u.id, label: u.name })), l.assignedTo || me.id) + '</select></div></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Create</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { const d = form(bg); Store.createTask(id, d.title, d.due, d.assignedTo); close(); toast('Task created'); })));
      act('newproject', () => V.projectModal({ companyId: l.companyId, leadId: id }));
      act('addcontact', () => { if (!l.companyId) { toast('Link a company first (Edit)', 'warn'); return; } V.contactModal(l.companyId); });
      act('archive', () => { if (l.archived) { Store.updateLead(id, { archived: false }); toast('Lead restored'); return; } modal('<h2>Archive ' + id + '?</h2><p style="margin:0;font-size:13px;color:var(--body)">The lead disappears from lists and counts. Its history is kept and you can unarchive it from this page.</p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Archive</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { close(); Store.updateLead(id, { archived: true }); toast('Lead archived'); })); });
      act('edit', () => modal('<h2>Edit lead</h2><div class="grid2"><div><label class="lbl">Company name</label><input class="in" name="companyName" value="' + esc(l.companyName) + '"></div><div><label class="lbl">Country</label><select class="in" name="country">' + opts(db().config.countries, l.country) + '</select></div><div><label class="lbl">Business email</label><input class="in" name="email" value="' + esc(l.email || '') + '"></div><div><label class="lbl">Phone</label><input class="in" name="phone" value="' + esc(l.phone || '') + '"></div><div><label class="lbl">Website</label><input class="in" name="website" value="' + esc(l.website || '') + '"></div><div><label class="lbl">Source</label><select class="in" name="source">' + opts(db().config.leadSources, l.source) + '</select></div><div class="span2"><label class="lbl">Notes</label><textarea class="in" name="notes" rows="3">' + esc(l.notes || '') + '</textarea></div></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Save</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { const d = form(bg); Store.updateLead(id, { companyName: d.companyName, country: d.country, email: d.email || null, phone: d.phone || null, website: d.website || null, source: d.source, notes: d.notes || null }); close(); toast('Saved'); })));
      act('clone', () => modal('<h2>Clone ' + id + '?</h2><p style="margin:0;font-size:13px;color:var(--muted)">Creates a new lead for ' + esc(l.companyName) + (ct ? ' · ' + esc(ct.firstName + ' ' + ct.lastName) : '') + ' with the same details and owner. It starts at status New. Activity, tasks and quotations stay on ' + id + '.</p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Clone lead</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { const n = Store.cloneLead(id); close(); toast('Cloned · ' + n.id + ' created from ' + id); location.hash = '#/leads/' + n.id; })));
    } };
  };
})();

<script>
/* Leads module (list + lead page), person first. Internally still named leads2*; it replaced the earlier Leads screens.
   LIST  – a paged table only (the lead list is expected to pass 100,000 rows). Filter → sort → slice one page;
           only that page is rendered. In the real build the same query string (tab, filters, s, sort, dir, page, size)
           goes to the API, which does the filtering, sorting and LIMIT/OFFSET in SQL on indexed columns.
   DETAIL – the main lead page (status, follow-up, Email / Call / Meeting / Research composer, timeline) with the
           person's profile on top: LinkedIn, headline, summary, experience, education, skills, languages.
   Profile data is entered by the team; nothing is fetched from LinkedIn. */
(function () {
  const { esc, fmtDate, rel, badge, prio, userLabel, opts, I, modal, toast, form, tile } = UI;
  const db = () => Store.db;
  const CLOSED = ['Won', 'Lost', 'Not Relevant'];
  const SIZES = [25, 50, 100];
  const fullName = (ct) => (ct ? (ct.firstName + ' ' + (ct.lastName || '')).trim() : '');
  const li = (ct, lg) => (ct && ct.linkedin ? '<a class="li-btn' + (lg ? ' lg' : '') + '" href="' + UI.href(ct.linkedin) + '" target="_blank" rel="noopener" title="Open LinkedIn profile" aria-label="LinkedIn profile">' + I.linkedin + (lg ? 'LinkedIn profile' : '') + '</a>' : (lg ? '<span class="li-btn lg off">' + I.linkedin + 'No LinkedIn yet</span>' : ''));
  const completeness = (ct) => { if (!ct) return 0; const checks = [ct.linkedin, ct.headline, ct.location, ct.about, ct.experience && ct.experience.length, ct.education && ct.education.length, ct.skills && ct.skills.length, ct.email, ct.mobile || ct.phone]; return Math.round(checks.filter(Boolean).length / checks.length * 100); };
  const qs = (o) => Object.keys(o).filter((k) => o[k] !== '' && o[k] !== undefined && o[k] !== null).map((k) => encodeURIComponent(k) + '=' + encodeURIComponent(o[k])).join('&');
  const FOLD_KEY = 'dait-l2-fold';
  const fold = (() => { try { return Object.assign({ profile: false, composer: false }, JSON.parse(localStorage.getItem(FOLD_KEY) || '{}')); } catch (e) { return { profile: false, composer: false }; } })();
  const saveFold = () => { try { localStorage.setItem(FOLD_KEY, JSON.stringify(fold)); } catch (e) { /* storage blocked: state lasts for this visit only */ } };
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const picked = new Set(); // leads ticked for the mailer; kept while paging, sorting and filtering
  const num = (n) => Number(n).toLocaleString('en-GB');

  /* ---------- list: table only, one page rendered ---------- */
  V.leads2List = function (q) {
    q = q || {}; const me = Store.currentUser(); const t = Store.today(); const tab = q.tab || 'all';
    const cmap = new Map(); db().contacts.forEach((c) => cmap.set(c.id, c)); // one pass; never a lookup per row per contact
    const ctOf = (l) => (l.contactId ? cmap.get(l.contactId) || null : null);
    const all = db().leads.filter((l) => !l.archived);
    let rows = all;
    if (tab === 'mine') rows = rows.filter((l) => l.assignedTo === me.id);
    const overdueIds = new Set(db().tasks.filter((x) => Store.isOverdue(x)).map((x) => x.leadId));
    if (tab === 'leads') rows = rows.filter((l) => l.type === 'Lead');
    if (tab === 'prospects') rows = rows.filter((l) => l.type === 'Prospect');
    if (tab === 'overdue') rows = rows.filter((l) => overdueIds.has(l.id) || (l.followUp && l.followUp < t && !CLOSED.includes(l.status)));
    ['status', 'source', 'country', 'type'].forEach((k) => { if (q[k]) rows = rows.filter((l) => l[k] === q[k]); });
    if (q.assigned) rows = rows.filter((l) => (q.assigned === 'none' ? !l.assignedTo : l.assignedTo === q.assigned));
    if (q.days) { const since = Store.addDays(t, -Number(q.days)); rows = rows.filter((l) => l.createdAt.slice(0, 10) >= since); }
    if (q.s) { const s = q.s.toLowerCase(); rows = rows.filter((l) => { const c = ctOf(l); return (l.id + ' ' + l.companyName + ' ' + (l.city || '') + ' ' + l.country + ' ' + (l.email || '') + (c ? ' ' + fullName(c) + ' ' + (c.designation || '') + ' ' + (c.headline || '') + ' ' + (c.email || '') + ' ' + (c.skills || []).join(' ') + ' ' + (c.experience || []).map((e) => e.company).join(' ') : '')).toLowerCase().includes(s); }); }
    const PRI = { High: '1', Medium: '2', Low: '3' };
    const KEYS = { id: (l) => l.id.replace(/\d+/, (n) => n.padStart(9, '0')), company: (l) => l.companyName, name: (l) => fullName(ctOf(l)), country: (l) => l.country, type: (l) => l.type, source: (l) => l.source, status: (l) => l.status, priority: (l) => PRI[l.priority] || '9', owner: (l) => (l.assignedTo ? Store.userName(l.assignedTo) : ''), followUp: (l) => l.followUp, created: (l) => l.createdAt };
    const sort = KEYS[q.sort] ? q.sort : 'created'; const dir = q.dir === 'asc' || q.dir === 'desc' ? q.dir : (sort === 'created' ? 'desc' : 'asc');
    const key = KEYS[sort]; const mul = dir === 'asc' ? 1 : -1;
    rows = rows.map((l) => [key(l) || '', l]).sort((a, b) => { if (!a[0] && b[0]) return 1; if (a[0] && !b[0]) return -1; const x = String(a[0]).toLowerCase(); const y = String(b[0]).toLowerCase(); return x < y ? -mul : x > y ? mul : (a[1].createdAt < b[1].createdAt ? 1 : -1); }).map((p) => p[1]); // empty values last
    const size = SIZES.includes(Number(q.size)) ? Number(q.size) : 50; const total = rows.length; const pages = Math.max(1, Math.ceil(total / size));
    const page = Math.min(pages, Math.max(1, parseInt(q.page, 10) || 1)); const from = (page - 1) * size; const pageRows = rows.slice(from, from + size);
    const link = (patch) => '#/leads?' + qs(Object.assign({}, q, patch));
    const tabBtn = (k, label, n, cls) => '<a class="tab' + (tab === k ? ' on' : '') + '" href="' + link({ tab: k === 'all' ? '' : k, page: '' }) + '">' + label + ' <span class="n ' + (cls || '') + '">' + num(n) + '</span></a>';
    const weekAgo = Store.addDays(t, -7); const newWeek = all.filter((l) => l.createdAt.slice(0, 10) >= weekAgo);
    const sel = (name, list, label, blank) => '<select class="chip" name="' + name + '" aria-label="' + label + '">' + opts(list, q[name] || '', blank) + '</select>';
    const th = (k, label) => '<th' + (sort === k ? ' aria-sort="' + (dir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '><a href="' + link({ sort: k, dir: sort === k && dir === 'asc' ? 'desc' : 'asc', page: '' }) + '" title="Sort by ' + label + '">' + label + (sort === k ? '<span class="ar">' + (dir === 'asc' ? '▲' : '▼') + '</span>' : '') + '</a></th>';
    // Same columns as the Leads table (Lead ID first), plus the LinkedIn icon beside the contact person.
    const row = (l) => { const c = ctOf(l); const name = fullName(c); const over = l.followUp && l.followUp < t && !CLOSED.includes(l.status);
      return '<tr data-go="#/leads/' + l.id + '"' + (picked.has(l.id) ? ' class="sel"' : '') + '><td class="ck"><input type="checkbox" data-sel="' + l.id + '"' + (picked.has(l.id) ? ' checked' : '') + ' aria-label="Select ' + l.id + '"></td><td><a href="#/leads/' + l.id + '" style="font-weight:600">' + l.id + '</a></td><td class="ell"><a href="#/leads/' + l.id + '" style="color:var(--text);font-weight:600">' + esc(l.companyName) + '</a></td><td class="nm">' + (name ? '<span class="n">' + esc(name) + '</span>' : '<span class="dim">No contact yet</span>') + li(c) + '</td><td>' + esc(l.country) + '</td><td>' + badge(l.type) + '</td><td>' + esc(l.source) + (l.importBatch ? ' · batch #' + esc(l.importBatch) : '') + '</td><td>' + badge(l.status) + '</td><td>' + prio(l.priority) + '</td><td>' + userLabel(l.assignedTo) + '</td><td>' + (l.followUp ? (over ? '<span style="color:var(--bad-fg);font-weight:600">' + fmtDate(l.followUp) + ' · overdue</span>' : fmtDate(l.followUp)) : '<span class="dim">—</span>') + '</td><td style="color:var(--muted)">' + fmtDate(l.createdAt) + '</td></tr>'; };
    const cfg = db().config;
    const pbtn = (label, p, off) => '<a class="btn sm" href="' + link({ page: p }) + '"' + (off ? ' aria-disabled="true" tabindex="-1"' : '') + '>' + label + '</a>';
    const pager = '<div class="pager"><span>' + (total ? num(from + 1) + '–' + num(Math.min(total, from + size)) + ' of ' + num(total) : '0 leads') + '</span><span class="grow"></span><label>Rows <select class="chip" name="size" aria-label="Rows per page" style="height:30px">' + opts(SIZES, size) + '</select></label>' + pbtn('« First', 1, page === 1) + pbtn('‹ Prev', page - 1, page === 1) + '<label>Page <input class="in" type="number" name="page" min="1" max="' + pages + '" value="' + page + '" aria-label="Go to page"> of ' + num(pages) + '</label>' + pbtn('Next ›', page + 1, page === pages) + pbtn('Last »', pages, page === pages) + '</div>';
    const html = topbar('Leads', 'Inbound leads and researched prospects, one module', '<label class="search">' + I.search + '<span class="sr">Search leads</span><input type="search" name="s" value="' + esc(q.s || '') + '" placeholder="Search company, contact, email…"></label><button class="btn" data-act="import">Import CSV</button><a class="btn primary" href="#/leads/new">' + I.plus + 'New lead</a>') +
      '<div class="page"><div class="tiles t3">' +
      tile('New this week', num(newWeek.length), num(newWeek.filter((l) => l.source === 'Website Contact Form').length) + ' from website form', 'ok') +
      tile('Follow-ups due today', num(db().tasks.filter((x) => Store.isToday(x)).length), num(db().tasks.filter((x) => Store.isOverdue(x)).length) + ' overdue', 'bad', '#/tasks') +
      tile('Unassigned', num(all.filter((l) => !l.assignedTo).length), 'mostly CSV + Google Places prospects', '', '#/leads?assigned=none') +
      '</div><div class="card flush l2"><div class="tabs">' + tabBtn('all', 'All leads', all.length) + tabBtn('leads', 'Leads', all.filter((l) => l.type === 'Lead').length) + tabBtn('prospects', 'Prospects', all.filter((l) => l.type === 'Prospect').length) + tabBtn('mine', 'My leads', all.filter((l) => l.assignedTo === me.id).length) + tabBtn('overdue', 'Overdue follow-ups', all.filter((l) => overdueIds.has(l.id)).length, 'bad') + '</div>' +
      '<form class="filters" id="leads2Filters">' + sel('status', cfg.leadStatuses, 'Status', 'Status: Any') + sel('source', cfg.leadSources, 'Source', 'Source: Any') + sel('country', cfg.countries, 'Country', 'Country: Any') + sel('assigned', db().users.map((u) => ({ value: u.id, label: u.name })).concat([{ value: 'none', label: 'Unassigned' }]), 'Assigned to', 'Assigned: Any') + sel('type', cfg.leadTypes, 'Lead type', 'Lead type: Any') + sel('days', [{ value: 7, label: 'Created: Last 7 days' }, { value: 30, label: 'Created: Last 30 days' }, { value: 90, label: 'Created: Last 90 days' }], 'Created', 'Created: Any time') + (['status', 'source', 'country', 'assigned', 'type', 'days', 's'].some((k) => q[k]) ? '<a class="btn sm" href="' + link({ status: '', source: '', country: '', assigned: '', type: '', days: '', s: '', page: '' }) + '">Clear</a>' : '') + '<div class="grow"></div><span style="font-size:12.5px;color:var(--muted)">Showing ' + num(total) + ' of ' + num(all.length) + '</span></form>' +
      '<div class="mbulk"><span data-selcount></span><span class="grow"></span><button type="button" class="btn sm" data-act="clearsel">Clear</button><button type="button" class="btn sm primary" data-act="mailer">' + I.send + 'Send via mailer</button></div>' +
      '<div class="tbl"><table><thead><tr><th class="ck"><input type="checkbox" data-selall aria-label="Select all leads on this page"></th>' + th('id', 'Lead ID') + th('company', 'Company name') + th('name', 'Contact person') + th('country', 'Country') + th('type', 'Type') + th('source', 'Source') + th('status', 'Status') + th('priority', 'Priority') + th('owner', 'Assigned to') + th('followUp', 'Next follow-up') + th('created', 'Created') + '</tr></thead><tbody>' + (pageRows.map(row).join('') || '<tr><td colspan="12"><div class="empty">No leads match these filters.</div></td></tr>') + '</tbody></table></div>' + pager + '</div></div>';
    return { html, mount(el) {
      const f = el.querySelector('#leads2Filters'); f.addEventListener('change', () => { location.hash = link(Object.assign(form(f), { page: '' })); });
      const s = el.querySelector('[name=s]'); s.addEventListener('keydown', (e) => { if (e.key === 'Enter') location.hash = link({ s: s.value.trim(), page: '' }); });
      el.querySelector('.pager [name=size]').addEventListener('change', (e) => { location.hash = link({ size: e.target.value, page: '' }); });
      const pg = el.querySelector('.pager [name=page]'); pg.addEventListener('change', () => { location.hash = link({ page: Math.min(pages, Math.max(1, parseInt(pg.value, 10) || 1)) }); });
      el.querySelector('[data-act=import]').addEventListener('click', () => V.importCsv());
      // tick boxes → "Send via mailer"
      const gate = V.mailerGate(); const bulk = el.querySelector('.mbulk'); const allBox = el.querySelector('[data-selall]'); const boxes = () => [...el.querySelectorAll('[data-sel]')];
      const sync = () => { [...picked].forEach((id) => { if (!Store.lead(id)) picked.delete(id); }); const n = picked.size; bulk.classList.toggle('on', n > 0); bulk.querySelector('[data-selcount]').innerHTML = '<strong>' + n + '</strong> selected' + (gate && n ? ' · <span class="dim">' + esc(gate) + ' <a href="#/settings">Open Settings</a></span>' : ''); const mb = bulk.querySelector('[data-act=mailer]'); mb.disabled = !!gate || !n; mb.title = gate || ''; const bs = boxes(); allBox.checked = bs.length > 0 && bs.every((b) => b.checked); allBox.indeterminate = !allBox.checked && bs.some((b) => b.checked); };
      const setRow = (b, on) => { b.checked = on; if (on) picked.add(b.dataset.sel); else picked.delete(b.dataset.sel); b.closest('tr').classList.toggle('sel', on); };
      el.querySelector('tbody').addEventListener('change', (e) => { const b = e.target.closest('[data-sel]'); if (b) { setRow(b, b.checked); sync(); } });
      allBox.addEventListener('change', () => { boxes().forEach((b) => setRow(b, allBox.checked)); sync(); });
      bulk.querySelector('[data-act=clearsel]').addEventListener('click', () => { picked.clear(); boxes().forEach((b) => setRow(b, false)); sync(); });
      bulk.querySelector('[data-act=mailer]').addEventListener('click', () => V.mailerWizard([...picked], () => picked.clear()));
      sync();
      el.querySelector('tbody').addEventListener('click', (e) => { if (e.target.closest('a') || e.target.closest('td.ck')) return; const tr = e.target.closest('tr[data-go]'); if (tr) location.hash = tr.dataset.go; }); // one listener for the whole page of rows
    } };
  };

  /* ---------- detail: main lead page + person profile ---------- */
  V.leads2Detail = function (id, tab) {
    const l = Store.lead(id); if (!l) return { html: topbar('Lead not found') + '<div class="page"><div class="empty">No lead with id ' + esc(id) + '. <a href="#/leads">Back to leads</a></div></div>' };
    tab = ['followup', 'email', 'call'].includes(tab) ? tab : 'followup'; // bottom card here: Follow-up | Emails | Calls
    const base = V.leadDetail(id, tab === 'call' ? 'call' : 'email'); // status stepper, follow-up, composer (email/call/meeting/research), timeline, side cards
    const ct = Store.contact(l.contactId); const c = Store.company(l.companyId);
    const name = fullName(ct) || l.companyName; const pct = completeness(ct);
    const lastAct = db().activities.filter((a) => a.leadId === id && ['call', 'email', 'meeting'].includes(a.type)).sort((a, b) => (a.at < b.at ? 1 : -1))[0];
    const fact = (label, value) => '<div><dt>' + label + '</dt><dd>' + (value || '<span class="dim">—</span>') + '</dd></div>';
    const lastTxt = lastAct ? esc(({ call: 'Call', email: 'Email', meeting: 'Meeting' })[lastAct.type]) + ' · ' + rel(lastAct.at) : '';
    const header = topbar(id,
      '<span class="l2line">Lead created: <b>' + fmtDate(l.createdAt) + '</b><i>|</i>Last contact: <b>' + (lastTxt || '—') + '</b></span>',
      '<div class="hdr-actions"><button class="btn primary" data-compose="email">' + I.send + 'Email</button>' + (ct ? '<button class="btn" data-act="editp">' + I.edit + 'Edit profile</button>' : '') + '</div>');
    const span = (x) => (x.from || '') + ' – ' + (x.to || 'Present');
    const facts = '<dl class="l2facts">' + fact('Lead source', esc(l.source)) + fact('Lead status', badge(l.status)) + fact('Lead type', badge(l.type)) + fact('Priority', prio(l.priority)) +

<script>
/* Mailer: send a personalised template to the leads ticked on the Leads page.

  const { esc, fmtDT, badge, opts, I, modal, toast } = UI;

  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  /* Why the current user cannot use the mailer, or null. */
  V.mailerGate = function () { const me = Store.currentUser(); return Store.accountFor(me.id) ? null : 'Connect your Microsoft 365 mailbox in Settings to use the mailer.'; };

    if (!acct) { toast(V.mailerGate(), 'warn'); return; }
    const rows = Store.mailerCheck(leadIds); const okRows = rows.filter((r) => !r.block);
    if (!okRows.length) { toast('None of the selected leads can be emailed (' + rows[0].block.toLowerCase() + (rows.length > 1 ? ', …' : '') + ').', 'warn'); return; }
    const tpls = Store.templatesFor(me.lang || 'en');
    const nowS = Store.now(); const defStart = nowS.slice(0, 11) + String(Math.min(23, Number(nowS.slice(11, 13)) + 1)).padStart(2, '0') + ':00';
    const st = { step: 0, name: 'Mailer · ' + UI.fmtDate(Store.today()) + ' · ' + plural(okRows.length, 'lead'), templateId: (tpls[0] || {}).id || '', cc: '', bcc: '', when: 'now', startAt: defStart, intervalMin: 3, workingHoursOnly: false, unsubscribeLine: true, lawfulBasis: '' };
    const STEPS = ['Template', 'Cc / Bcc', 'Timing', 'Review & send'];
    const tpl = () => tpls.find((x) => x.id === st.templateId) || null;
    const sampleCtx = () => { const r = okRows[0]; return { first_name: (r.name || '').split(' ')[0] || 'there', company: r.company, me: me.name, lead_id: r.leadId }; };
    const staff = db().users.filter((u) => u.email && u.id !== me.id);

    modal('<div data-wiz></div>', (bg, close) => {
      bg.querySelector('.modal').style.width = '760px';
      const box = bg.querySelector('[data-wiz]');
      const head = () => '<h2>Send via mailer</h2><ol class="wsteps">' + STEPS.map((s, i) => '<li class="' + (i === st.step ? 'on' : i < st.step ? 'done' : '') + '"><span>' + (i + 1) + '</span>' + s + '</li>').join('') + '</ol>';
      const foot = (nextLabel) => '<div class="actions"><button class="btn" data-close>Cancel</button><span class="grow"></span>' + (st.step ? '<button class="btn" data-back>Back</button>' : '') + '<button class="btn primary" data-next>' + nextLabel + '</button></div>';
      const save = () => { box.querySelectorAll('[data-f]').forEach((i) => { st[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.type === 'radio' ? (i.checked ? i.value : st[i.dataset.f]) : i.value; }); };
      const draw = () => {
        let body = '';
        if (st.step === 0) { const t = tpl(); const cx = sampleCtx();
          body = '<div class="grid2"><div><label class="lbl" for="mwName">Campaign name</label><input id="mwName" class="in" data-f="name" value="' + esc(st.name) + '"></div><div><label class="lbl" for="mwTpl">Template</label><select id="mwTpl" class="in" data-f="templateId">' + tpls.map((x) => '<option value="' + x.id + '"' + (x.id === st.templateId ? ' selected' : '') + '>' + esc(x.name) + (x.source === 'oft' ? ' · .oft' : '') + ' (' + esc(x.lang.toUpperCase()) + ')</option>').join('') + '</select></div></div>' +
            (t ? '<div class="mprev"><div class="lbl">Preview for ' + esc(okRows[0].name || okRows[0].company) + ' · ' + esc(okRows[0].to) + '</div><div class="msub">' + esc(Store.fillTemplate(t.subject, cx)) + '</div><pre>' + esc(Store.fillTemplate(t.body, cx)) + '</pre></div>' : '<div class="note warn">No templates yet. Add one under Settings → Email templates.</div>') +
            '<div class="dim" style="font-size:12.5px">Each email is filled in per lead: <code>{first_name}</code>, <code>{company}</code>, <code>{me}</code>, <code>{lead_id}</code>. From: ' + esc(acct.address) + '.</div>'; }
        if (st.step === 1) { const quick = (f) => '<div class="mquick">' + staff.map((u) => '<button type="button" class="btn xs" data-add="' + f + '" data-email="' + esc(u.email) + '">+ ' + esc(u.name) + '</button>').join('') + '</div>';
          body = '<div><label class="lbl" for="mwCc">Cc <span class="dim">· on every email, visible to the recipient</span></label><input id="mwCc" class="in" data-f="cc" value="' + esc(st.cc) + '" placeholder="name@company.com, another@company.com">' + quick('cc') + '</div><div><label class="lbl" for="mwBcc">Bcc <span class="dim">· on every email, hidden from the recipient</span></label><input id="mwBcc" class="in" data-f="bcc" value="' + esc(st.bcc) + '" placeholder="name@company.com">' + quick('bcc') + '</div><div class="dim" style="font-size:12.5px">Both are optional. Separate addresses with commas. Cc and Bcc receive one copy per lead, so ' + plural(okRows.length, 'email') + ' each.</div>'; }
        if (st.step === 2) { const n = okRows.length; const mins = (n - 1) * Number(st.intervalMin);
          body = '<div class="grid2"><div><div class="lbl">When to start</div><label class="mradio"><input type="radio" name="mwWhen" data-f="when" value="now"' + (st.when === 'now' ? ' checked' : '') + '> Send now</label><label class="mradio"><input type="radio" name="mwWhen" data-f="when" value="later"' + (st.when === 'later' ? ' checked' : '') + '> Start at <input class="in" type="datetime-local" data-f="startAt" value="' + esc(st.startAt) + '" aria-label="Start date and time" style="width:210px;height:32px;margin-left:6px"></label></div>' +
            '<div><label class="lbl" for="mwInt">Delay between emails</label><select id="mwInt" class="in" data-f="intervalMin">' + [1, 2, 3, 5, 10, 15].map((m) => '<option value="' + m + '"' + (Number(st.intervalMin) === m ? ' selected' : '') + '>One every ' + plural(m, 'minute') + '</option>').join('') + '</select><label class="sw" style="margin-top:10px;font-size:12.5px"><input type="checkbox" data-f="workingHoursOnly"' + (st.workingHoursOnly ? ' checked' : '') + '> Only send in working hours (' + Store.WORK_HOURS[0] + '–' + Store.WORK_HOURS[1] + ', office time)</label></div></div>' +
            '<div class="note info">' + plural(n, 'email') + ', one every ' + plural(Number(st.intervalMin), 'minute') + ': the last one goes out about ' + (mins < 60 ? plural(mins, 'minute') : (Math.round(mins / 6) / 10) + ' hours') + ' after the start. That is far inside Microsoft 365\'s limits (about 30 a minute, 10,000 recipients a day).' + (n > 200 ? ' <strong>More than 200 in one run</strong> starts to look like bulk mail from a personal mailbox; consider splitting it across days.' : '') + '</div>' +
            '<div class="dim" style="font-size:12.5px">Prototype speed: a minute of delay runs as one second here, so you can watch a run finish. The real build waits the full time.</div>'; }
        if (st.step === 3) { const t = tpl(); const skip = rows.filter((r) => r.block);
          body = '<dl class="kv" style="grid-template-columns:120px 1fr"><dt>Template</dt><dd>' + esc(t ? t.name : '—') + '</dd><dt>From</dt><dd>' + esc(me.name) + ' · ' + esc(acct.address) + '</dd><dt>Cc</dt><dd>' + (st.cc ? esc(list(st.cc).join(', ')) : '<span class="dim">—</span>') + '</dd><dt>Bcc</dt><dd>' + (st.bcc ? esc(list(st.bcc).join(', ')) : '<span class="dim">—</span>') + '</dd><dt>Timing</dt><dd>' + (st.when === 'now' ? 'Starts now' : 'Starts ' + esc(fmtDT(st.startAt + ':00'))) + ' · one every ' + plural(Number(st.intervalMin), 'minute') + (st.workingHoursOnly ? ' · working hours only' : '') + '</dd></dl>' +
            '<div class="tbl mrec"><table><thead><tr><th>Lead</th><th>Name</th><th>To</th><th>Result</th></tr></thead><tbody>' + rows.map((r) => '<tr><td>' + esc(r.leadId) + '</td><td>' + esc(r.name || r.company) + '</td><td>' + (r.to ? esc(r.to) : '<span class="dim">—</span>') + '</td><td>' + (r.block ? badge('Skipped', 'b-grey') + ' <span class="dim">' + esc(r.block) + '</span>' : badge('Will send', 'b-ok')) + '</td></tr>').join('') + '</tbody></table></div>' +
            '<div class="grid2"><div><label class="lbl" for="mwLaw">Lawful basis for contacting these leads <span class="req">*</span></label><select id="mwLaw" class="in" data-f="lawfulBasis"><option value="">— choose —</option>' + lawful.map((x) => '<option' + (st.lawfulBasis === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><div class="lbl">Opt-out</div><label class="sw" style="font-size:12.5px;margin-top:8px"><input type="checkbox" data-f="unsubscribeLine"' + (st.unsubscribeLine ? ' checked' : '') + '> Add an unsubscribe line to every email</label></div></div>' +
            '<div class="note ' + (skip.length ? 'warn' : 'ok') + '"><strong>' + plural(okRows.length, 'email') + ' will be queued.</strong>' + (skip.length ? ' ' + plural(skip.length, 'lead') + ' skipped (see the table).' : '') + ' Leads that reply, unsubscribe or close before their turn are skipped automatically.</div>'; }
        box.innerHTML = head() + body + foot(st.step === 3 ? I.send + 'Queue ' + plural(okRows.length, 'email') : 'Next');
        I18N.apply(box); UI.enhanceSelects(box);
        const first = box.querySelector('[data-f]'); if (first && st.step < 3) first.focus();
        box.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => { save(); const f = b.dataset.add; const cur = list(st[f]); if (!cur.some((x) => x.toLowerCase() === b.dataset.email.toLowerCase())) cur.push(b.dataset.email); st[f] = cur.join(', '); draw(); }));
        if (st.step === 0) box.querySelector('#mwTpl').addEventListener('change', () => { save(); draw(); });
        if (st.step === 2) box.querySelectorAll('#mwInt,[data-f=when],[data-f=startAt]').forEach((i) => i.addEventListener('change', () => { save(); if (i.dataset.f === 'startAt') st.when = 'later'; draw(); }));
        const back = box.querySelector('[data-back]'); if (back) back.addEventListener('click', () => { save(); st.step--; draw(); });
        box.querySelector('[data-next]').addEventListener('click', () => { save();
          if (st.step === 0 && !tpl()) { toast('Choose a template', 'warn'); return; }
          if (st.step === 1) { const bad = list(st.cc).concat(list(st.bcc)).find((a) => !EMAIL_RE.test(a)); if (bad) { toast('"' + bad + '" is not a full email address', 'warn'); return; } }
          if (st.step === 2 && st.when === 'later' && !st.startAt) { toast('Choose a start date and time', 'warn'); return; }
          if (st.step < 3) { st.step++; draw(); return; }
          if (!st.lawfulBasis) { toast('Choose the lawful basis before sending', 'warn'); return; }
          try { const c = Store.createCampaign({ name: st.name, templateId: st.templateId, leadIds, cc: st.cc, bcc: st.bcc, startAt: st.when === 'later' ? st.startAt + ':00' : null, intervalMin: st.intervalMin, workingHoursOnly: st.workingHoursOnly, unsubscribeLine: st.unsubscribeLine, lawfulBasis: st.lawfulBasis });
            close(); toast(c.status === 'Scheduled' ? c.id + ' scheduled' : c.id + ' is sending'); if (onDone) onDone(c); location.hash = '#/mailer/' + c.id; }
          catch (err) { toast(err.message, 'warn'); }
        });
      };
      draw();
    });
  };

  /* ---------- Mailer page ---------- */
  const bar = (n) => { const done = n.Sent + n.Failed; const pct = n.toSend ? Math.round(done / n.toSend * 100) : 100; return '<span class="mbar" title="' + done + ' of ' + n.toSend + '"><i style="width:' + pct + '%"></i></span> <span class="dim">' + done + ' / ' + n.toSend + '</span>'; };
  const when = (c) => (c.status === 'Scheduled' ? 'Starts ' + fmtDT(c.startAt) : c.completedAt ? 'Ended ' + fmtDT(c.completedAt) : 'Started ' + fmtDT(c.createdAt));
  V.mailer = function (id) {
    const all = db().campaigns || []; const gate = V.mailerGate();
    if (id) return detail(id);
    const html = topbar('Mailer', 'Personalised emails to selected leads, sent one by one from your own mailbox', '<a class="btn primary" href="#/leads">' + I.plus + 'New from Leads</a>') +
      '<div class="page">' + (gate ? '<div class="note warn">' + esc(gate) + ' <a href="#/settings">Open Settings</a></div>' : '') +
      '<div class="card flush"><div class="head"><h2>Campaigns</h2><span class="dim" style="font-size:12.5px">Tick leads on the Leads page, then choose Send via mailer.</span></div><div class="tbl"><table><thead><tr><th>Campaign</th><th>Template</th><th>Sender</th><th>Progress</th><th>Replied</th><th>Status</th><th>When</th></tr></thead><tbody>' +
      (all.map((c) => { const n = Store.campaignStats(c); return '<tr data-go="#/mailer/' + c.id + '" style="cursor:pointer"><td><a href="#/mailer/' + c.id + '" style="font-weight:600">' + c.id + '</a> · ' + esc(c.name) + '</td><td>' + esc(c.templateName) + '</td><td>' + esc(Store.userName(c.senderId)) + '</td><td>' + bar(n) + '</td><td>' + n.replied + '</td><td>' + sb(c.status) + (c.waitingForHours && c.status === 'Sending' ? ' <span class="dim">waiting for working hours</span>' : '') + '</td><td class="dim">' + esc(when(c)) + '</td></tr>'; }).join('') || '<tr><td colspan="7"><div class="empty">No campaigns yet. Go to <a href="#/leads">Leads</a>, tick the people to email and choose Send via mailer.</div></td></tr>') +
      '</tbody></table></div></div>' +
      '<div class="note info">Sending limits to keep in mind: a personal Microsoft 365 mailbox suits a few dozen to a few hundred personalised emails a day. Thousands a day is marketing mail and belongs on a dedicated sending service, so the daitpartners.com domain keeps its reputation.</div></div>';
    return { html, mount(el) { const tb = el.querySelector('tbody'); tb.addEventListener('click', (e) => { if (e.target.closest('a')) return; const tr = e.target.closest('tr[data-go]'); if (tr) location.hash = tr.dataset.go; }); } };
  };
  function detail(id) {
    const c = Store.campaign(id); if (!c) return { html: topbar('Campaign not found') + '<div class="page"><div class="empty">No campaign ' + esc(id) + '. <a href="#/mailer">Back to Mailer</a></div></div>' };
    const n = Store.campaignStats(c); const live = ['Sending', 'Scheduled', 'Paused'].includes(c.status);
    const rStatus = (r) => (r.status === 'Sent' && db().emails.some((e) => e.folder === 'inbox' && e.leadId === r.leadId && e.at > r.sentAt) ? 'Replied' : r.status);
    const next = c.recipients.find((r) => r.status === 'Queued');
    const html = topbar(c.id + ' · ' + esc(c.name), sb(c.status) + ' <span class="l2line">' + esc(when(c)) + (c.status === 'Sending' && c.waitingForHours ? '<i>|</i>Waiting for working hours (' + Store.WORK_HOURS[0] + '–' + Store.WORK_HOURS[1] + ')' : c.status === 'Sending' && next ? '<i>|</i>Next: ' + esc(next.name || next.company) : '') + (c.pauseReason && c.status === 'Paused' ? '<i>|</i>' + esc(c.pauseReason) : '') + '</span>',
      '<div class="hdr-actions">' + (c.status === 'Scheduled' ? '<button class="btn" data-m="start">Start now</button>' : '') + (['Sending', 'Scheduled'].includes(c.status) ? '<button class="btn" data-m="pause">Pause</button>' : '') + (c.status === 'Paused' ? '<button class="btn primary" data-m="resume">Resume</button>' : '') + (live ? '<button class="btn danger" data-m="cancel">Cancel remaining</button>' : '') + '</div>', '<a href="#/mailer">Mailer</a> / ' + c.id) +
      '<div class="page"><div class="tiles">' + UI.tile('Sent', n.Sent, bar(n), '') + UI.tile('Queued', n.Queued, live ? 'one every ' + plural(c.intervalMin, 'minute') : 'nothing waiting', '') + UI.tile('Skipped / failed', n.Skipped + ' / ' + n.Failed, 'reason shown under the status', n.Failed ? 'bad' : '') + UI.tile('Replied', n.replied, 'matched from the mailbox', n.replied ? 'ok' : '') + '</div>' +
      '<div class="cols"><div class="col-main"><section class="card flush"><div class="head"><h2>Recipients</h2><span class="dim" style="font-size:12.5px">' + plural(n.total, 'lead') + ' · audit record per recipient</span></div><div class="tbl"><table><thead><tr><th>Lead</th><th>Name</th><th>To</th><th>Status</th><th>Sent at</th><th>Message</th></tr></thead><tbody>' +
      c.recipients.map((r) => '<tr><td><a href="#/leads/' + r.leadId + '/email" style="font-weight:600">' + esc(r.leadId) + '</a></td><td>' + esc(r.name || r.company) + '</td><td>' + (r.to ? esc(r.to) : '<span class="dim">—</span>') + '</td><td style="white-space:normal">' + sb(rStatus(r)) + (r.error ? '<div class="dim" style="font-size:12px;margin-top:3px">' + esc(r.error) + '</div>' : '') + '</td><td>' + (r.sentAt ? esc(fmtDT(r.sentAt)) : '<span class="dim">—</span>') + '</td><td class="dim">' + (r.messageId ? esc(r.messageId) : '—') + '</td></tr>').join('') + '</tbody></table></div></section></div>' +
      '<aside class="col-side"><section class="card" style="gap:10px"><h2>Details</h2><dl class="kv" style="grid-template-columns:110px 1fr"><dt>Template</dt><dd>' + esc(c.templateName) + (c.templateVersion ? ' <span class="dim">· version of ' + esc(UI.fmtDate(c.templateVersion)) + '</span>' : '') + '</dd><dt>From</dt><dd>' + esc(Store.userName(c.senderId)) + '<div class="dim" style="font-weight:400">' + esc(c.senderAddress) + '</div></dd><dt>Cc</dt><dd>' + (c.cc ? esc(c.cc) : '<span class="dim">—</span>') + '</dd><dt>Bcc</dt><dd>' + (c.bcc ? esc(c.bcc) : '<span class="dim">—</span>') + '</dd><dt>Start</dt><dd>' + (c.startAt ? esc(fmtDT(c.startAt)) : 'Immediately') + '</dd><dt>Delay</dt><dd>One every ' + plural(c.intervalMin, 'minute') + (c.workingHoursOnly ? ' · working hours only' : '') + '</dd><dt>Opt-out line</dt><dd>' + (c.unsubscribeLine ? 'Included' : 'Not included') + '</dd><dt>Lawful basis</dt><dd style="font-weight:400">' + esc(c.lawfulBasis) + '</dd><dt>Created</dt><dd>' + esc(Store.userName(c.createdBy)) + ' · ' + esc(fmtDT(c.createdAt)) + '</dd></dl></section>' +
      '<section class="card" style="gap:8px"><h2>Email as queued</h2><div class="mprev" style="margin:0"><div class="msub">' + esc(c.subject) + '</div><pre>' + esc(c.body) + '</pre></div><div class="dim" style="font-size:12px">Saved with the campaign, so later template edits do not change this record.</div></section></aside></div></div>';
    return { html, mount(el) {
      const on = (k, fn) => { const b = el.querySelector('[data-m=' + k + ']'); if (b) b.addEventListener('click', fn); };
      on('start', () => { Store.startCampaignNow(id); toast(id + ' started'); });
      on('pause', () => { Store.pauseCampaign(id); toast(id + ' paused'); });
      on('resume', () => { try { Store.resumeCampaign(id); toast(id + ' resumed'); } catch (err) { toast(err.message, 'warn'); } });
      on('cancel', () => modal('<h2>Cancel the rest of ' + id + '?</h2><p style="margin:0;font-size:13px;color:var(--muted)">' + plural(n.Queued, 'email') + ' still queued will not be sent. Emails already sent stay on their leads. This cannot be undone.</p><div class="actions"><button class="btn" data-close>Keep sending</button><button class="btn primary" data-go>Cancel remaining</button></div>', (bg, close) => bg.querySelector('[data-go]').addEventListener('click', () => { close(); Store.cancelCampaign(id); toast(id + ' cancelled'); })));
    } };
  }
})();

</script>
<script>
/* Company Management views: list and tabbed profile (Overview, Contacts, Locations, Leads & Prospects, Activities, AI Intelligence, Research Sources). */
(function () {
  const { esc, dash, fmtDate, fmtDT, rel, badge, prio, userLabel, aiTag, okTag, opts, I, timeline, modal, toast, form, tile, logo } = UI;
  const db = () => Store.db;
  const cnt = (list, fn) => list.filter(fn).length;

  V.companiesList = function (q) {
    const cfg = db().config; const t = Store.today();
    let rows = db().companies.slice(); const tab = q.tab || 'all';
    const openLeads = (c) => cnt(db().leads, (l) => l.companyId === c.id && !['Won', 'Lost', 'Not Relevant'].includes(l.status) && !l.archived);
    if (tab === 'clients') rows = rows.filter((c) => c.isClient);
    if (tab === 'open') rows = rows.filter((c) => openLeads(c) > 0);
    if (tab === 'verify') rows = rows.filter((c) => c.ai.verification !== 'Verified');
    const dupPairs = []; const seen = {}; db().companies.forEach((c) => { const k = Store.norm(c.name); if (seen[k]) dupPairs.push([seen[k], c]); else seen[k] = c; });
    db().enquiries.filter((e) => e.status === 'Needs review').forEach((e) => dupPairs.push([null, e]));
    if (tab === 'dups') rows = [];
    ['industry', 'country', 'status', 'employeeRange'].forEach((k) => { if (q[k]) rows = rows.filter((c) => c[k] === q[k]); });
    if (q.verification) rows = rows.filter((c) => c.ai.verification === q.verification);
    if (q.s) { const s = q.s.toLowerCase(); rows = rows.filter((c) => [c.id, c.name, c.legalName, c.domain, c.registrationNumber, c.city].join(' ').toLowerCase().includes(s)); }
    rows.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    const all = db().companies; const link = (patch) => '#/companies?' + qs(Object.assign({}, q, patch));
    const tabBtn = (key, label, n, cls) => '<a class="tab' + (tab === key ? ' on' : '') + '" href="' + link({ tab: key === 'all' ? '' : key }) + '">' + label + ' <span class="n ' + (cls || '') + '">' + n + '</span></a>';
    const sel = (name, list, label, blank) => '<select class="chip" name="' + name + '" aria-label="' + label + '">' + opts(list, q[name] || '', blank) + '</select>';
    const queue = { pending: cnt(all, (c) => c.ai.status === 'Pending'), processing: cnt(all, (c) => c.ai.status === 'Processing'), failed: cnt(all, (c) => c.ai.status === 'Failed') };
    const html = topbar('Companies', 'Master database of every organisation. A company is not a lead.', '<label class="search">' + I.search + '<span class="sr">Search companies</span><input type="search" name="s" value="' + esc(q.s || '') + '" placeholder="Search name, domain, registration no…"></label><button class="btn primary" data-act="new">' + I.plus + 'New company</button>') +
      '<div class="page"><div class="tiles">' + tile('Total companies', all.length, cnt(all, (c) => c.status === 'Active') + ' active · ' + cnt(all, (c) => c.status === 'Inactive') + ' inactive · ' + cnt(all, (c) => c.status === 'Closed') + ' closed') + tile('Verified profiles', cnt(all, (c) => c.ai.verification === 'Verified'), cnt(all, (c) => c.ai.verification === 'Partially verified') + ' partially · ' + cnt(all, (c) => c.ai.verification === 'Unverified') + ' unverified') + tile('AI research queue', queue.pending + queue.processing + queue.failed, queue.pending + ' pending · ' + queue.processing + ' processing · ' + queue.failed + ' failed', 'warn') + tile('Possible duplicates', dupPairs.length, 'awaiting manual review', 'bad', link({ tab: 'dups' })) + '</div>' +
      '<div class="card flush"><div class="tabs">' + tabBtn('all', 'All companies', all.length) + tabBtn('clients', 'Clients', cnt(all, (c) => c.isClient)) + tabBtn('open', 'With open leads', cnt(all, (c) => openLeads(c) > 0)) + tabBtn('verify', 'Needs verification', cnt(all, (c) => c.ai.verification !== 'Verified')) + tabBtn('dups', 'Duplicate review', dupPairs.length, 'bad') + '</div>' +
      (tab === 'dups' ? '<div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">' + (dupPairs.map((p) => p[0] ? '<div class="note warn"><strong>Similar company names:</strong> <a href="#/companies/' + p[0].id + '">' + esc(p[0].name) + ' (' + p[0].id + ')</a> and <a href="#/companies/' + p[1].id + '">' + esc(p[1].name) + ' (' + p[1].id + ')</a>. Not merged automatically; an administrator decides.</div>' : '<div class="note warn"><strong>Enquiry ' + p[1].id + '</strong> from ' + esc(p[1].companyName) + ' matched more than one company. <a href="#/enquiries/' + p[1].id + '">Review and choose</a>.</div>').join('') || '<div class="empty">No duplicates awaiting review.</div>') + '</div>' :

  V.companyModal = function (existing) {

      const d = form(bg); if (!d.name) { toast('Company name is required', 'warn'); return; }
      const patch = {}; // Editing: an emptied field is saved as NULL (unknown), so wrong values can be removed. New company: blanks are skipped.
      const had = (k) => c[k] !== null && c[k] !== undefined && c[k] !== '';
      ['name', 'legalName', 'website', 'industry', 'businessType', 'status', 'country', 'state', 'city', 'zip', 'street', 'employeeRange', 'revenueRange', 'ownership', 'registrationNumber', 'linkedin', 'webTech', 'description', 'services', 'products'].forEach((k) => { if (d[k] !== '' && d[k] !== (c[k] || '')) patch[k] = d[k]; else if (existing && d[k] === '' && had(k) && k !== 'name' && k !== 'status') patch[k] = null; });
      if (d.businessCategory && d.businessCategory !== c.category) patch.category = d.businessCategory; else if (existing && !d.businessCategory && had('category')) patch.category = null;
      ['yearEstablished', 'employeeCount', 'revenue'].forEach((k) => { if (d[k] !== '' && Number(d[k]) !== c[k]) patch[k] = Number(d[k]); else if (existing && d[k] === '' && had(k)) patch[k] = null; });

    }));
  };
