name: Deploy to test
# Runs only after the CI workflow (name: CI) finished green for a push to main, and deploys exactly
# the commit CI tested. Tests are not re-run here; CI already ran them against that sha.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-test
  cancel-in-progress: false
jobs:
  deploy:
    # Only a successful push run from this repository (not a pull request whose branch is named main).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Production dependencies only; the server runs this bundle as is (no npm ci there).
      - run: npm ci --omit=dev
      - name: Pack the release
        run: |
          tar czf "$SHA.tgz" package.json package-lock.json node_modules \
            packages/shared/package.json packages/shared/dist \
            apps/api/package.json apps/api/dist apps/api/assets \
            apps/worker/package.json apps/worker/dist \
            apps/web/dist prisma deploy
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and install on test
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then echo "unexpected sha: $SHA" >&2; exit 1; fi
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          scp $SSH_OPTS "$SHA.tgz" "$TARGET:incoming/$SHA.tgz"
          # ~/test/current does not exist on the first deploy, so run the script from the tarball itself.
          ssh $SSH_OPTS "$TARGET" "tar xzf ~/incoming/$SHA.tgz -O deploy/release.sh > ~/incoming/release-$SHA.sh && bash ~/incoming/release-$SHA.sh install test ~/incoming/$SHA.tgz $SHA && rm -f ~/incoming/release-$SHA.sh"
