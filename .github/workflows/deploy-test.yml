name: Deploy to test
# Manual only (owner, 23 Nov 2026): the test copy (~/test, crm-test.daitpartners.com) is not set up on the server, so
# an automatic deploy after every green CI run failed each time. Live is deployed by hand. To use this once the test
# copy exists: Actions → Deploy to test → Run workflow, and give the full 40-character sha of a commit CI passed on main.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha (CI must have passed on it)
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Production dependencies only; the server runs this bundle as is (no npm ci there).
      - run: npm ci --omit=dev
      - name: Pack the release
        run: |
          tar czf "$SHA.tgz" package.json package-lock.json node_modules \
            packages/shared/package.json packages/shared/dist \
            apps/api/package.json apps/api/dist apps/api/assets \
            apps/worker/package.json apps/worker/dist \
            apps/web/dist prisma deploy
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and install on test
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then echo "unexpected sha: $SHA" >&2; exit 1; fi
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          scp $SSH_OPTS "$SHA.tgz" "$TARGET:incoming/$SHA.tgz"
          # ~/test/current does not exist on the first deploy, so run the script from the tarball itself.
          ssh $SSH_OPTS "$TARGET" "tar xzf ~/incoming/$SHA.tgz -O deploy/release.sh > ~/incoming/release-$SHA.sh && bash ~/incoming/release-$SHA.sh install test ~/incoming/$SHA.tgz $SHA && rm -f ~/incoming/release-$SHA.sh"
